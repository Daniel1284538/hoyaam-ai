<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>هويام المحامية الجامدة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ==========================================================================
   Design tokens — matches the firm's approved template (hoyaam design
   system) exactly: same custom properties, same fonts, same component
   class names, so this file and the template stay visually interchangeable.
   ========================================================================== */
:root {
  --bg: #F4F5F7;
  --card: #FFFFFF;
  --inset: #EAECF0;
  --border: #DCE0E6;
  --text: #2A1B5E;
  --text-2: #B0206E;
  --text-dim: #8C6BAE;
  --accent: #FD6262;
  --good: #16A34A;
  --warn: #D9720A;
  --danger: #C3272C;
  --gold: #9C7A3C;
  --font-ui: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-doc: 'Amiri', serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(42, 27, 94, 0.05);
  --shadow-md: 0 4px 12px rgba(42, 27, 94, 0.08);
}
[data-theme="dark"] {
  --bg: #10131A; --card: #171B23; --inset: #0C0F14; --border: #262D39;
  --text: #E8EAED; --text-2: #8B94A3; --text-dim: #4E5768;
  --accent: #FD6262; --good: #22C55E; --warn: #F5A623; --danger: #E5484D; --gold: #C9A66B;
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4); --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.5);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; width: 100%; }
body {
  font-family: var(--font-ui); background-color: var(--bg); color: var(--text);
  /* direction is deliberately NOT set here — it must inherit from <html dir="...">,
     which the English toggle flips at runtime (setLang). Hardcoding rtl here would
     silently override that and break the whole point of the toggle. */
  line-height: 1.6; text-align: start; -webkit-font-smoothing: antialiased;
}
bdi, .mono-data { font-family: var(--font-mono); direction: ltr; unicode-bidi: isolate; display: inline-block; }
.doc-heading, h1, h2, h3 { font-family: var(--font-doc); letter-spacing: -0.01em; }
a { color: var(--text-2); }

/* App shell */
.app-layout { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
.sidebar {
  width: 260px; min-width: 260px; background: var(--card);
  border-inline-end: 1px solid var(--border); display: flex; flex-direction: column; height: 100%;
}
.sidebar-header { padding-block: 20px; padding-inline: 18px; border-block-end: 1px solid var(--border); }
.firm-brand { display: flex; align-items: center; gap: 12px; overflow: hidden; }
.firm-logo {
  width: 38px; height: 38px; border-radius: var(--radius-md); background: var(--text); color: var(--gold);
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: var(--font-doc);
  font-size: 20px; flex-shrink: 0; border: 1px solid var(--gold); overflow: hidden;
}
.firm-logo img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
.auth-mascot { display: flex; justify-content: center; margin-block-end: 4px; }
.auth-mascot img { width: 120px; height: 120px; border-radius: var(--radius-lg); object-fit: cover; object-position: top center; border: 1px solid var(--gold); box-shadow: var(--shadow-md); }
.firm-title { font-family: var(--font-doc); font-size: 17px; font-weight: 700; color: var(--text); white-space: nowrap; line-height: 1.2; }
.firm-subtitle { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
.nav-links { list-style: none; padding-block: 14px; padding-inline: 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; overflow-y: auto; }
.nav-item button {
  width: 100%; display: flex; align-items: center; gap: 12px; padding-block: 10px; padding-inline: 14px;
  border-radius: var(--radius-md); border: 1px solid transparent; background: transparent; color: var(--text-2);
  font-family: var(--font-ui); font-size: 14px; font-weight: 500; cursor: pointer; text-align: start; transition: all .15s ease;
}
.nav-item button:hover { background: var(--inset); color: var(--text); }
.nav-item.active button { background: var(--inset); color: var(--text); border-color: var(--border); font-weight: 600; }
.nav-item.active button .nav-icon { color: var(--accent); }
.nav-icon { width: 20px; height: 20px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; color: var(--text-dim); }
.nav-badge {
  margin-inline-start: auto; padding-block: 2px; padding-inline: 8px; border-radius: 12px; font-size: 11px;
  font-family: var(--font-mono); font-weight: 600; background: var(--inset); color: var(--text-dim); border: 1px solid var(--border);
}
.nav-badge.danger { background: rgba(195,39,44,.12); color: var(--danger); border-color: rgba(195,39,44,.25); }
.nav-section-title { padding-inline: 14px; padding-block: 14px 4px; font-size: 11px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; }
.sidebar-footer { padding-block: 14px; padding-inline: 14px; border-block-start: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.lawyer-profile { display: flex; align-items: center; gap: 10px; overflow: hidden; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--inset); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; color: var(--text); flex-shrink: 0; }
.lawyer-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; }
.lawyer-role { font-size: 11px; color: var(--text-dim); white-space: nowrap; }

.main-wrapper { flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; background: var(--bg); }
.top-bar { height: 60px; min-height: 60px; background: var(--card); border-block-end: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding-inline: 24px; gap: 16px; }
.top-bar-start { display: flex; align-items: center; gap: 16px; flex: 1; max-width: 480px; }
.top-bar-actions { display: flex; align-items: center; gap: 10px; }
.icon-btn { width: 36px; height: 36px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--card); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .15s ease; }
.icon-btn:hover { background: var(--inset); }

.page-container { flex: 1; overflow-y: auto; padding-block: 24px; padding-inline: 28px; }
.page-header { display: flex; align-items: center; justify-content: space-between; margin-block-end: 24px; gap: 16px; flex-wrap: wrap; }
.page-title { font-size: 26px; font-weight: 700; color: var(--text); display: flex; align-items: baseline; gap: 12px; }
.page-subtitle { font-size: 13px; color: var(--text-dim); font-weight: 400; font-family: var(--font-ui); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding-block: 8px; padding-inline: 16px; border-radius: var(--radius-md); font-family: var(--font-ui); font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid transparent; transition: all .15s ease; white-space: nowrap; }
.btn:disabled { opacity: .55; cursor: default; }
.btn-primary { background: var(--text); color: var(--card); border-color: var(--text); }
.btn-primary:hover { opacity: .92; }
.btn-accent { background: var(--accent); color: #fff; }
.btn-outline { background: var(--card); color: var(--text); border-color: var(--border); }
.btn-outline:hover { background: var(--inset); }
.btn-link { background: none; border: none; color: var(--text-dim); font-family: var(--font-ui); font-size: 13px; font-weight: 500; cursor: pointer; padding: 4px; text-decoration: underline; }
.btn-link:hover { color: var(--text); }
.btn-sm { padding-block: 4px; padding-inline: 10px; font-size: 12px; }
.btn-good { background: rgba(22,163,74,.1); color: var(--good); border-color: rgba(22,163,74,.3); }
.btn-good:hover { background: var(--good); color: #fff; }
.btn-warn { background: rgba(217,114,10,.1); color: var(--warn); border-color: rgba(217,114,10,.3); }
.btn-warn:hover { background: var(--warn); color: #fff; }
.btn-danger { background: rgba(195,39,44,.1); color: var(--danger); border-color: rgba(195,39,44,.3); }
.btn-danger:hover { background: var(--danger); color: #fff; }

/* Cards / panels */
.dash-panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding-block: 20px; padding-inline: 22px; display: flex; flex-direction: column; gap: 16px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; border-block-end: 1px solid var(--border); padding-block-end: 12px; gap: 12px; flex-wrap: wrap; }
.panel-title { font-size: 18px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
.panel-count { font-size: 12px; font-family: var(--font-mono); color: var(--text-dim); background: var(--inset); padding-block: 2px; padding-inline: 8px; border-radius: 10px; }

/* Deadlines */
.deadline-row { display: flex; align-items: center; justify-content: space-between; padding-block: 12px; padding-inline: 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--card); gap: 12px; }
.deadline-row.overdue { border-inline-start: 4px solid var(--danger); }
.deadline-row.this-week { border-inline-start: 4px solid var(--warn); }
.deadline-row.upcoming { border-inline-start: 4px solid var(--good); }
.deadline-info { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.deadline-title { font-size: 14px; font-weight: 600; color: var(--text); }
.deadline-meta { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--text-dim); flex-wrap: wrap; }
.citation-tag { font-family: var(--font-mono); font-size: 11px; background: var(--inset); color: var(--text-2); padding-block: 2px; padding-inline: 6px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
.chip-overdue-days { background: rgba(195,39,44,.12); color: var(--danger); font-weight: 700; }

/* Dashboard */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-block-end: 20px; }
.stat-tile { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.stat-tile.alert-tile { border-color: rgba(195,39,44,.4); background: rgba(195,39,44,.05); }
.stat-label { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; justify-content: space-between; }
.stat-number { font-size: 28px; font-weight: 800; color: var(--text); font-family: var(--font-mono); }
.stat-sub { font-size: 11px; color: var(--text-dim); }
.dashboard-columns { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; align-items: start; }
@media (max-width: 900px) { .dashboard-columns { grid-template-columns: 1fr; } }
.timeline-list { display: flex; flex-direction: column; gap: 12px; }
.timeline-item { display: flex; gap: 12px; align-items: flex-start; }
.time-badge { flex-shrink: 0; font-family: var(--font-mono); font-size: 12px; font-weight: 700; background: var(--inset); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 8px; }
.timeline-content { flex: 1; min-width: 0; }
.timeline-matter-num { font-weight: 700; font-size: 13px; color: var(--accent); cursor: pointer; }
.timeline-detail { font-size: 12px; color: var(--text); margin-block-start: 2px; }
.timeline-sub { font-size: 12px; color: var(--text-dim); margin-block-start: 2px; }

/* Notifications bell */
.notif-wrapper { position: relative; }
.notif-badge { position: absolute; top: -4px; inset-inline-end: -4px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding-inline: 3px; }
.notif-dropdown { position: absolute; inset-inline-end: 0; top: calc(100% + 8px); width: 360px; max-width: 90vw; max-height: 70vh; overflow-y: auto; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-md); z-index: 60; display: flex; flex-direction: column; }
.notif-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-block-end: 1px solid var(--border); font-size: 13px; font-weight: 700; }
.notif-list { display: flex; flex-direction: column; }
.notif-item { display: flex; gap: 10px; padding: 10px 16px; border-block-end: 1px solid var(--border); cursor: pointer; }
.notif-item:hover { background: var(--inset); }
.notif-item-icon { flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.notif-item-icon.danger { background: var(--danger); color: #fff; }
.notif-item-icon.warn { background: var(--warn); color: #fff; }
.notif-item-title { font-size: 12px; font-weight: 700; color: var(--text); }
.notif-item-meta { font-size: 11px; color: var(--text-dim); margin-block-start: 2px; }
.notif-footer { padding: 10px 16px; background: var(--inset); border-block-start: 1px solid var(--border); display: flex; justify-content: space-between; }

/* Hearing roll calendar */
.roll-layout { display: grid; grid-template-columns: 340px 1fr; gap: 20px; align-items: start; }
@media (max-width: 900px) { .roll-layout { grid-template-columns: 1fr; } }
.calendar-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 18px; }
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-block-end: 12px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal-day-name { font-size: 11px; color: var(--text-dim); font-weight: 700; padding-block: 4px; }
.cal-day-cell { font-size: 13px; font-family: var(--font-mono); padding-block: 8px; border-radius: var(--radius-sm); cursor: pointer; position: relative; }
.cal-day-cell:hover { background: var(--inset); }
.cal-day-cell.selected { background: var(--accent); color: #fff; font-weight: 700; }
.cal-day-cell.has-hearings:not(.selected)::after { content: ''; position: absolute; bottom: 3px; inset-inline-start: 50%; transform: translateX(-50%); width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

/* Chips */
.chip { display: inline-flex; align-items: center; gap: 6px; padding-block: 3px; padding-inline: 10px; border-radius: 12px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip-confirmed { background: rgba(22,163,74,.12); color: var(--good); border: 1px solid rgba(22,163,74,.35); }
.chip-provisional { background: rgba(217,114,10,.12); color: var(--warn); border: 1px dashed rgba(217,114,10,.6); animation: pulse-soft 2s infinite ease-in-out; }
@keyframes pulse-soft { 0%,100% { opacity: 1; } 50% { opacity: .75; } }
.chip-stage { background: var(--inset); color: var(--text-2); border: 1px solid var(--border); font-size: 11px; }
.chip-danger { background: rgba(195,39,44,.12); color: var(--danger); border: 1px solid rgba(195,39,44,.35); }

/* Tables */
.table-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
.filter-bar { padding-block: 14px; padding-inline: 18px; background: var(--card); border-block-end: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.filter-input { height: 36px; padding-inline: 12px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--inset); color: var(--text); font-family: var(--font-ui); font-size: 13px; outline: none; flex: 1; min-width: 200px; }
.filter-input:focus { border-color: var(--text); background: var(--card); }
.filter-select { height: 36px; padding-inline: 12px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--inset); color: var(--text); font-family: var(--font-ui); font-size: 13px; outline: none; }
.table-wrapper { overflow-x: auto; width: 100%; }
.dense-table { width: 100%; border-collapse: collapse; text-align: start; }
.dense-table th { background: var(--inset); color: var(--text-2); font-size: 12px; font-weight: 600; padding-block: 10px; padding-inline: 14px; border-block-end: 1px solid var(--border); white-space: nowrap; }
.dense-table td { padding-block: 12px; padding-inline: 14px; font-size: 13px; color: var(--text); border-block-end: 1px solid var(--border); }
.dense-table tbody tr { cursor: pointer; transition: background .1s ease; }
.dense-table tbody tr:hover { background: var(--inset); }
.dense-table td.cell-matter-num { font-family: var(--font-mono); font-weight: 600; color: var(--text); }
.empty-note { color: var(--text-dim); font-size: 14px; padding: 18px; }

/* Matter detail */
.matter-header-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding-block: 22px; padding-inline: 26px; margin-block-end: 20px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 16px; }
.matter-header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.matter-headline { font-family: var(--font-doc); font-size: 24px; font-weight: 700; color: var(--text); line-height: 1.3; }
.matter-meta-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--text-2); }
.meta-item { display: inline-flex; align-items: center; gap: 6px; }
.tabs-nav { display: flex; align-items: center; gap: 4px; border-block-end: 1px solid var(--border); margin-block-end: 20px; overflow-x: auto; }
.tab-btn { padding-block: 10px; padding-inline: 18px; border: none; background: transparent; color: var(--text-2); font-family: var(--font-ui); font-size: 14px; font-weight: 500; cursor: pointer; border-block-end: 2px solid transparent; transition: all .15s ease; white-space: nowrap; }
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent); border-block-end-color: var(--accent); font-weight: 600; }

/* Upload */
.upload-zone { border: 2px dashed var(--border); border-radius: var(--radius-lg); padding-block: 40px; padding-inline: 28px; text-align: center; background: var(--card); cursor: pointer; transition: border-color .15s ease, background .15s ease; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.upload-zone:hover, .upload-zone.dragover { border-color: var(--accent); background: var(--inset); }
.upload-icon { width: 42px; height: 42px; color: var(--accent); }
.upload-title { font-size: 16px; font-weight: 600; color: var(--text); }
.upload-desc { font-size: 12.5px; color: var(--text-dim); max-width: 440px; }
.file-progress-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding-block: 16px; padding-inline: 20px; display: flex; flex-direction: column; gap: 12px; }
.file-info-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.filename { font-weight: 600; font-size: 14px; color: var(--text); display: flex; align-items: center; gap: 8px; }
.file-stepper { display: flex; align-items: center; justify-content: space-between; position: relative; padding-block: 8px; }
.file-step { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; position: relative; z-index: 2; }
.step-dot { width: 24px; height: 24px; border-radius: 50%; background: var(--inset); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--text-dim); }
.file-step.completed .step-dot { background: var(--good); border-color: var(--good); color: #fff; }
.file-step.current .step-dot { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 0 3px rgba(253,98,98,.2); }
.file-step.failed .step-dot { background: var(--danger); border-color: var(--danger); color: #fff; }
.step-name { font-size: 11.5px; color: var(--text-dim); font-weight: 500; }
.file-step.completed .step-name, .file-step.current .step-name, .file-step.failed .step-name { color: var(--text); font-weight: 600; }

/* Review split view */
.split-review-container { display: grid; grid-template-columns: 1fr 1.05fr; gap: 20px; height: calc(100vh - 210px); min-height: 420px; }
@media (max-width: 900px) { .split-review-container { grid-template-columns: 1fr; height: auto; } }
.doc-viewer-pane, .extractions-pane { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); display: flex; flex-direction: column; overflow: hidden; }
.doc-viewer-header, .extractions-header { padding-block: 12px; padding-inline: 16px; border-block-end: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--inset); gap: 10px; }
.doc-canvas-area { flex: 1; background: #20242D; position: relative; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 16px; }
.doc-canvas-area iframe, .doc-canvas-area img { width: 100%; height: 100%; border: none; background: #fff; border-radius: 4px; object-fit: contain; }
.doc-page-text { flex: 1; overflow-y: auto; padding: 20px; font-family: var(--font-doc); font-size: 15px; line-height: 1.9; color: var(--text); background: var(--card); white-space: pre-wrap; }
.extractions-list { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.extraction-row { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; background: var(--card); display: flex; flex-direction: column; gap: 10px; }
.extraction-row.confirmed, .extraction-row.corrected { border-inline-start: 4px solid var(--good); }
.extraction-row.rejected { border-inline-start: 4px solid var(--danger); opacity: .65; }
.ext-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.ext-field-name { font-weight: 600; font-size: 13px; color: var(--text); }
.confidence-chip { font-family: var(--font-mono); font-size: 11px; font-weight: 700; padding-block: 2px; padding-inline: 8px; border-radius: 10px; }
.confidence-high { background: rgba(22,163,74,.15); color: var(--good); }
.confidence-mid { background: rgba(217,114,10,.15); color: var(--warn); }
.confidence-low { background: rgba(195,39,44,.15); color: var(--danger); }
.ext-value-input { width: 100%; padding-block: 8px; padding-inline: 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--card); color: var(--text); font-family: var(--font-ui); font-size: 13px; font-weight: 500; outline: none; }
.ext-value-input:focus { border-color: var(--text); }
.ext-actions-bar { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.review-footer { padding-block: 14px; padding-inline: 18px; border-block-start: 1px solid var(--border); background: var(--inset); display: flex; align-items: center; justify-content: space-between; gap: 16px; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: var(--shadow-md); display: flex; flex-direction: column; gap: 18px; }
.modal-card-wide { max-width: 960px; }

/* Citation & Provision Inspector */
.citation-inspect-card { border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--inset); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.citation-inspect-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 760px) { .citation-inspect-grid { grid-template-columns: 1fr; } }
.citation-inspect-col h4 { margin: 0 0 6px; font-size: 11px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; }
.citation-inspect-col p { margin: 0; font-size: 13px; line-height: 1.8; color: var(--text); white-space: pre-wrap; }
.citation-inspect-unbound { font-size: 12px; color: var(--text-dim); font-style: italic; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-label { font-size: 13px; font-weight: 600; color: var(--text); }
.form-input, .form-textarea, .form-select {
  padding-block: 8px; padding-inline: 12px; border-radius: var(--radius-md); border: 1px solid var(--border);
  background: var(--inset); color: var(--text); font-family: var(--font-ui); font-size: 13px; outline: none; width: 100%;
}
.form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--text); background: var(--card); }
.form-hint { font-size: 11px; color: var(--text-dim); }
.form-error { font-size: 12px; color: var(--danger); background: rgba(195,39,44,.08); border: 1px solid rgba(195,39,44,.25); border-radius: var(--radius-sm); padding: 8px 12px; }
.form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 520px) { .form-row-2 { grid-template-columns: 1fr; } }

/* Toast */
.app-toast { position: fixed; bottom: 24px; inset-inline-start: 24px; background: var(--text); color: #fff; padding: 12px 20px; border-radius: var(--radius-md); box-shadow: var(--shadow-md); z-index: 999; display: flex; align-items: center; gap: 10px; font-size: 13px; animation: toast-in .3s ease; }
@keyframes toast-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* Auth screens (not in the reference template — same tokens/fonts, own layout) */
.auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); }
.auth-card { width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding: 32px; display: flex; flex-direction: column; gap: 16px; }
.auth-brand { display: flex; align-items: center; gap: 12px; margin-block-end: 4px; }

/* Chronology timeline */
.chronology-tree { display: flex; flex-direction: column; gap: 18px; }
.chron-entry { display: flex; gap: 18px; padding-inline-start: 16px; border-inline-start: 2px solid var(--border); position: relative; padding-bottom: 4px; }
.chron-entry::before { content: ''; position: absolute; inset-inline-start: -6px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.chron-date { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--text-2); min-width: 95px; }
.chron-desc { font-size: 14px; color: var(--text); flex: 1; }
.chron-ref-chip { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: 11px; background: var(--inset); color: var(--text-2); padding-block: 2px; padding-inline: 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); margin-block-start: 6px; }

/* Archive search / research */
.search-hero-box { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 22px; margin-block-end: 20px; display: flex; flex-direction: column; gap: 14px; }
.search-results-list { display: flex; flex-direction: column; gap: 14px; }
.search-result-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px 20px; display: flex; flex-direction: column; gap: 8px; }
.search-result-title { font-size: 14px; font-weight: 700; color: var(--text); }
.search-snippet { font-family: var(--font-doc); font-size: 15px; color: var(--text); line-height: 1.7; }
.ai-summary-box { background: rgba(176,32,110,.04); border: 1px solid rgba(176,32,110,.2); border-radius: var(--radius-md); padding: 16px 20px; }
.ai-summary-content { font-size: 14px; line-height: 1.75; color: var(--text); white-space: pre-wrap; }
.template-content-preview { white-space: pre-wrap; margin-block-start: 10px; max-height: 160px; overflow: auto; font-family: var(--font-mono); font-size: 12.5px; color: var(--text-2); background: var(--inset); border-radius: var(--radius-sm); padding: 10px 12px; }

/* Template variable fill — deterministic, non-AI drafting fast path */
.generator-layout { display: grid; grid-template-columns: 360px 1fr; gap: 20px; max-height: 72vh; }
@media (max-width: 1024px) { .generator-layout { grid-template-columns: 1fr; max-height: none; } }
.generator-controls-pane { background: var(--inset); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
.generator-preview-pane { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); display: flex; flex-direction: column; overflow: hidden; }
.generator-preview-toolbar { padding: 10px 16px; background: var(--inset); border-block-end: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.generator-preview-canvas { flex: 1; padding: 22px; background: var(--bg); overflow-y: auto; display: flex; justify-content: center; }
.legal-parchment { width: 100%; max-width: 700px; background: #FFFFFF; color: #111827; border: 2px solid #D1D5DB; box-shadow: 0 8px 24px rgba(0,0,0,.08); padding: 36px 44px; font-family: var(--font-doc); font-size: 15px; line-height: 2; position: relative; border-radius: 4px; }
[data-theme="dark"] .legal-parchment { background: #1C2029; color: #E2E8F0; border-color: #334155; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.legal-header-emblem { text-align: center; border-block-end: 2px double #9CA3AF; padding-block-end: 12px; margin-block-end: 16px; }
.legal-basmalah { font-size: 18px; font-weight: 700; margin-block-end: 4px; }
.legal-sub-header { font-size: 13px; color: var(--text-2); }
.legal-body-text { white-space: pre-wrap; word-break: break-word; text-align: justify; }
.legal-token-missing { background: rgba(217,114,10,.18); color: var(--warn); padding: 1px 4px; border-radius: 3px; font-weight: 700; }
@media print {
  body * { visibility: hidden; }
  #print-target, #print-target * { visibility: visible; }
  #print-target { position: absolute; inset-inline-start: 0; top: 0; width: 100%; box-shadow: none; border: none; }
}
</style>

// ---------- i18n ----------
// English toggle. UI CHROME only — nav labels, buttons, headers, table
// headers, empty states, static help text — is translated. Real case
// DATA (matter subjects, party names, extracted document text, AI-
// generated drafts, search snippets) is never touched: translating a
// legal record would risk altering what it actually says, exactly the
// kind of fabrication risk this build has refused everywhere else.
//
// Implementation: h() below runs every literal string child (and every
// placeholder/title attribute) through t(), which looks it up in
// EN_DICT by EXACT text match when currentLang is 'en'. This means the
// ~560 UI strings translate automatically everywhere they're already
// passed to h() as plain string children — no per-call-site rename to
// t('key') needed at the (very many) places that build this UI. The
// tradeoff: a handful of strings assembled via JS template-literal
// interpolation (e.g. `تعذّر التحميل: ${error.message}`) resolve to one
// string BEFORE reaching h(), so they miss this exact-match lookup —
// the highest-traffic ones (error prefixes, tab counts) were
// restructured into array children so their static half still
// translates; a residual few, low-traffic strings (some admin toast
// confirmations) may still show in Arabic when English is selected.
let currentLang = (() => { try { return localStorage.getItem('litigation-agent-lang') || 'ar'; } catch { return 'ar'; } })();
function localeTag() { return currentLang === 'en' ? 'en-GB' : 'ar-EG'; }

function t(text) {
  if (currentLang !== 'en' || typeof text !== 'string') return text;
  return Object.prototype.hasOwnProperty.call(EN_DICT, text) ? EN_DICT[text] : text;
}

async function setLang(lang) {
  if (lang === currentLang) return;
  currentLang = lang;
  try { localStorage.setItem('litigation-agent-lang', lang); } catch {}
  document.documentElement.setAttribute('lang', lang);
  document.documentElement.setAttribute('dir', lang === 'en' ? 'ltr' : 'rtl');
  // The toggle only appears once logged in (in renderShell's top bar),
  // but this stays defensive: if there's no shell up yet (mid-login),
  // re-running boot() re-derives and re-renders whichever screen — login,
  // MFA, or the app — is actually current, in the new language.
  if (document.getElementById('content')) { await renderShell(location.hash); route(); }
  else boot();
}

// ---------- small helpers ----------
function h(tag, attrs = {}, children = []) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if ((k === 'placeholder' || k === 'title') && typeof v === 'string') el.setAttribute(k, t(v));
    // A <textarea>'s displayed content comes from its child text node /
    // .value property, not the value HTML attribute — setAttribute here is
    // a silent no-op for it. Without this, every textarea bound as
    // value: form.x (buildForm's generic textarea field, and the matter
    // subject field) renders blank on any repaint: an edit dialog opening
    // on existing text, or a validation-error repaint discarding whatever
    // was typed, same class of bug the earlier documented textarea fix was
    // for.
    else if (k === 'value' && tag === 'textarea') el.value = v;
    else if (v !== null && v !== undefined) el.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c === null || c === undefined) continue;
    el.appendChild(typeof c === 'string' ? document.createTextNode(t(c)) : c);
  }
  return el;
}
function bdi(text) { return h('bdi', {}, String(text)); }
function icon(name, extraClass) { return h('span', { class: `nav-icon ${extraClass || ''}`, html: ICONS[name] || '' }); }
function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }
function fmtDate(d) { return d ? new Date(d).toLocaleDateString(localeTag()) : '—'; }
function fmtDateTime(d) { return d ? new Date(d).toLocaleString(localeTag()) : '—'; }
function todayISO() { return new Date().toISOString().slice(0, 10); }
function addDaysISO(iso, days) { const d = new Date(iso); d.setDate(d.getDate() + days); return d.toISOString().slice(0, 10); }
function daysUntil(iso) { return Math.ceil((new Date(iso) - new Date(todayISO())) / (1000 * 60 * 60 * 24)); }
function initials(name) { return (name || '').trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('') || '؟'; }

async function callFunction(slug, body) {
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch(`${FUNCTIONS_URL}/${slug}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session?.access_token ?? ''}` },
    body: JSON.stringify(body),
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || `${slug} failed (${res.status})`);

// Generic small-form builder for the back-office screens — same
// error/loading/reset lifecycle every openXDialog already hand-rolls
// individually, factored out once since the admin modules need it
// repeatedly. field: { key, label, type: 'text'|'email'|'number'|
// 'date'|'datetime-local'|'textarea'|'select', options?: [[value,label]] }
function buildForm({ fields, defaults, submitLabel, onSubmit, danger }) {
  const form = {};
  for (const f of fields) form[f.key] = (defaults && defaults[f.key]) || '';
  let error = null, loading = false;
  const container = h('div', {});

  function paint() {
    clear(container);
    if (error) container.appendChild(h('div', { class: 'form-error' }, error));
    for (const f of fields) {
      let input;
      if (f.type === 'select') {
        input = h('select', { class: 'form-select', onchange: (e) => (form[f.key] = e.target.value) },
          f.options.map(([v, l]) => h('option', { value: v, selected: form[f.key] === v ? 'true' : null }, l)));
      } else if (f.type === 'textarea') {
        input = h('textarea', { class: 'form-textarea', rows: '3', value: form[f.key], oninput: (e) => (form[f.key] = e.target.value) });
      } else {
        input = h('input', { class: 'form-input', type: f.type || 'text', value: form[f.key], oninput: (e) => (form[f.key] = e.target.value) });
      }
      container.appendChild(h('div', { class: 'form-group' }, [h('label', { class: 'form-label' }, f.label), input]));
    }
    container.appendChild(h('button', {
      class: `btn ${danger ? 'btn-danger' : 'btn-primary'}`, disabled: loading ? 'true' : null,
      onclick: async () => {
        error = null; loading = true; paint();
        try {
          await onSubmit(form);
          loading = false;
          for (const f of fields) form[f.key] = (defaults && defaults[f.key]) || '';
          paint();
        } catch (e) { error = e.message; loading = false; paint(); }
      },
    }, loading ? 'جارٍ الحفظ…' : submitLabel));
  }
  paint();
  return container;
}

async function loadViewer() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return null;
  const [{ data: profile }, { data: roleRows }] = await Promise.all([
    sb.from('profiles').select('full_name').eq('id', user.id).maybeSingle(),
    sb.from('user_roles').select('role_id, roles(label_en)').eq('user_id', user.id).is('revoked_at', null),
  ]);
  const roleIds = (roleRows || []).map((r) => r.role_id).filter(Boolean);
  const roleLabel = (roleRows || []).map((r) => r.roles?.label_en).filter(Boolean).join(', ') || 'بدون دور';

  // Reflects what has_capability() would say, from the same two globally-
  // readable tables it reads (user_roles, role_capabilities) — drives nav
  // visibility only. Every actual write still goes through an Edge
  // Function's own requireCapability(), which is the real enforcement.
  let capabilities = new Set();
  if (roleIds.length > 0) {
    const { data: capRows } = await sb.from('role_capabilities').select('capability_id').in('role_id', roleIds);
    capabilities = new Set((capRows || []).map((c) => c.capability_id));
  }

  return { userId: user.id, email: user.email || '', fullName: profile?.full_name || user.email || '', roleLabel, roleIds, capabilities };
}

// Self-service password reset, via Supabase Auth's own email-link flow —
// this app previously had no path except a manual SQL-level reset by
// whoever operates the Supabase project (see CHANGELOG). Deliberately
// reuses that same underlying mechanism (auth.users.encrypted_password),
// just through the standard supported entry point instead of raw SQL.
//
// resetPasswordForEmail() never reveals whether the address is actually
// registered — same message either way — so this can't be used to probe
// which emails have accounts.
function renderForgotPassword(prefillEmail) {
  clear(app);
  let email = prefillEmail || '', error = null, sent = false, loading = false;

  function paint() {
    clear(app);
    const box = h('div', { class: 'auth-card' }, [
      h('div', { class: 'auth-brand' }, [h('div', { class: 'firm-logo' }, [h('img', { src: AVATAR_SRC, alt: 'هويام' })]), h('div', { class: 'firm-title' }, 'إعادة تعيين كلمة المرور')]),
      sent
        ? h('p', { class: 'form-hint' }, 'إذا كان هذا البريد الإلكتروني مسجلاً لدينا، فسيصلك رابط لإعادة تعيين كلمة المرور خلال دقائق. تحقق من صندوق البريد الوارد ومجلد الرسائل غير المرغوب فيها.')
        : h('p', { class: 'form-hint' }, 'أدخل بريدك الإلكتروني وسنرسل لك رابطاً لإعادة تعيين كلمة المرور.'),
      error ? h('div', { class: 'form-error' }, error) : null,
      !sent ? h('div', { class: 'form-group' }, [h('label', { class: 'form-label' }, 'البريد الإلكتروني'),
        h('input', { class: 'form-input', type: 'email', value: email, oninput: (e) => (email = e.target.value) })]) : null,
      !sent ? h('button', {
        class: 'btn btn-primary', disabled: loading ? 'true' : null,
        onclick: async () => {
          error = null;
          if (!email.trim()) { error = 'البريد الإلكتروني مطلوب'; paint(); return; }
          loading = true; paint();
          // redirectTo strips any hash/query so the reset link always
          // lands back on this app's own root, where the recovery
          // detection below (isRecoveryUrl / PASSWORD_RECOVERY) picks it
          // up — never on whatever page happened to be open when the
          // user originally requested the reset.
          const redirectTo = location.origin + location.pathname;
          const { error: resetError } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo });
          loading = false;
          // Supabase already declines to reveal whether the address
          // exists via the response itself; still surface a genuine
          // network/rate-limit error if one comes back, rather than
          // claiming success no matter what happened.
          if (resetError) { error = resetError.message; paint(); return; }
          sent = true; paint();
        },
      }, loading ? 'جارٍ الإرسال…' : 'إرسال رابط إعادة التعيين') : null,
      h('button', { class: 'btn-link', style: 'margin-top:12px; width:100%; text-align:center', onclick: () => renderLogin() }, '→ العودة لتسجيل الدخول'),
    ]);
    app.appendChild(h('div', { class: 'auth-screen' }, box));
  }
  paint();
}

// Lands here from the emailed reset link, via the PASSWORD_RECOVERY auth
// event (see the bootstrap code at the bottom of this file) — Supabase
// has already exchanged the link's token for a real (recovery-scoped)
// session by this point, so this screen's only job is collecting the new
// password and calling updateUser(). Falls through to the normal boot()
// afterward, which still enforces MFA exactly as on any other sign-in —
// a password reset is not a way to skip the two-factor gate.
function renderSetNewPassword() {
  clear(app);
  let password = '', confirm = '', error = null, loading = false;
  // MFA is mandatory on every account here (see boot()'s comment on
  // matters_require_mfa), so a recovery-link or admin-temp-password
  // session lands at AAL1 whenever the account already has a verified
  // TOTP factor — and Supabase's own updateUser({password}) hard-rejects
  // a password change from anything below AAL2 ("AAL2 session is
  // required to update email or password when MFA is enabled"), a real
  // failure hit on a real account. So before ever showing the password
  // form, check the account's factors/AAL and, if elevation is needed,
  // walk through the same challenge/verify step renderMfaChallenge()
  // uses elsewhere — just without its boot() redirect, since this screen
  // still has its own job to do afterward.
  let step = 'checking'; // 'checking' | 'mfa' | 'password'
  let mfaFactorId = null;
  let code = '';

  async function checkAal() {
    const { data: factors } = await sb.auth.mfa.listFactors();
    const verified = (factors?.totp || []).find((f) => f.status === 'verified');
    if (!verified) { step = 'password'; paint(); return; }
    const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    if (aal && aal.currentLevel !== 'aal2') { mfaFactorId = verified.id; step = 'mfa'; paint(); return; }
    step = 'password'; paint();
  }

  function paint() {
    clear(app);
    if (step === 'checking') {
      app.appendChild(h('div', { class: 'auth-screen' }, h('div', { class: 'auth-card' }, h('p', { class: 'form-hint' }, 'جارٍ التحقق…'))));
      return;
    }
    if (step === 'mfa') {
      const box = h('div', { class: 'auth-card' }, [
        h('div', { class: 'auth-brand' }, [h('div', { class: 'firm-logo' }, [h('img', { src: AVATAR_SRC, alt: 'هويام' })]), h('div', { class: 'firm-title' }, 'التحقق بخطوتين')]),
        h('p', { class: 'form-hint' }, 'حسابك مفعّل عليه التحقق بخطوتين — أدخل رمز تطبيق المصادقة (TOTP) لمتابعة تعيين كلمة المرور.'),
        error ? h('div', { class: 'form-error' }, error) : null,
        h('div', { class: 'form-group' }, [h('label', { class: 'form-label' }, 'الرمز'),
          h('input', { class: 'form-input mono-data', style: 'font-family:var(--font-mono)', inputmode: 'numeric', maxlength: '6', value: code, oninput: (e) => (code = e.target.value) })]),
        h('button', {
          class: 'btn btn-primary', disabled: loading ? 'true' : null,
          onclick: async () => {
            error = null; loading = true; paint();
            try {
              const { data: ch, error: chErr } = await sb.auth.mfa.challenge({ factorId: mfaFactorId });
              if (chErr) throw chErr;
              const { error: vErr } = await sb.auth.mfa.verify({ factorId: mfaFactorId, challengeId: ch.id, code });
              if (vErr) throw vErr;
              loading = false; step = 'password'; paint();
            } catch (e) { error = e.message; loading = false; paint(); }
          },
        }, loading ? 'جارٍ التحقق…' : 'تأكيد'),
      ]);
      app.appendChild(h('div', { class: 'auth-screen' }, box));
      return;
    }
    const box = h('div', { class: 'auth-card' }, [
      h('div', { class: 'auth-brand' }, [h('div', { class: 'firm-logo' }, [h('img', { src: AVATAR_SRC, alt: 'هويام' })]), h('div', { class: 'firm-title' }, 'تعيين كلمة مرور جديدة')]),
      h('p', { class: 'form-hint' }, 'اختر كلمة مرور جديدة لحسابك.'),
      error ? h('div', { class: 'form-error' }, error) : null,
      h('div', { class: 'form-group' }, [h('label', { class: 'form-label' }, 'كلمة المرور الجديدة'),
        h('input', { class: 'form-input', type: 'password', value: password, oninput: (e) => (password = e.target.value) })]),
      h('div', { class: 'form-group' }, [h('label', { class: 'form-label' }, 'تأكيد كلمة المرور'),
        h('input', { class: 'form-input', type: 'password', value: confirm, oninput: (e) => (confirm = e.target.value) })]),
      h('button', {
        class: 'btn btn-primary', disabled: loading ? 'true' : null,
        onclick: async () => {
          error = null;
          if (password.length < 8) { error = 'كلمة المرور يجب ألا تقل عن 8 أحرف'; paint(); return; }
          if (password !== confirm) { error = 'كلمتا المرور غير متطابقتين'; paint(); return; }
          loading = true; paint();
          // data: clears must_change_password (harmless if it was never
          // set — this same screen also serves the emailed-reset-link
          // path, which has no such flag to begin with). By this point
          // the session is AAL2 whenever the account requires it (see
          // checkAal() above), so this no longer hits Supabase's AAL2
          // guard on password updates.
          const { error: updateError } = await sb.auth.updateUser({ password, data: { must_change_password: false } });
          loading = false;
          if (updateError) { error = updateError.message; paint(); return; }
          // Clear the recovery token out of the URL now that it's been
          // consumed, then proceed exactly like any other successful
          // sign-in — MFA enrollment/challenge still applies.
          history.replaceState(null, '', location.pathname);
          boot();
        },
      }, loading ? 'جارٍ الحفظ…' : 'حفظ كلمة المرور الجديدة'),
    ]);
    app.appendChild(h('div', { class: 'auth-screen' }, box));
  }
  paint();
  checkAal();
}

function renderMfaChallenge(factorId) {
  clear(app);
  let code = '', error = null, loading = false;
  function paint() {
    clear(app);
    const box = h('div', { class: 'auth-card' }, [
      h('div', { class: 'auth-brand' }, [h('div', { class: 'firm-logo' }, [h('img', { src: AVATAR_SRC, alt: 'هويام' })]), h('div', { class: 'firm-title' }, 'التحقق بخطوتين')]),
      h('p', { class: 'form-hint' }, 'أدخل رمز تطبيق المصادقة (TOTP)'),
      error ? h('div', { class: 'form-error' }, error) : null,
      h('div', { class: 'form-group' }, [h('label', { class: 'form-label' }, 'الرمز'),
        h('input', { class: 'form-input mono-data', style: 'font-family:var(--font-mono)', inputmode: 'numeric', maxlength: '6', value: code, oninput: (e) => (code = e.target.value) })]),
      h('button', {
        class: 'btn btn-primary', disabled: loading ? 'true' : null,
        onclick: async () => {
          error = null; loading = true; paint();
          try {
            const { data: ch, error: chErr } = await sb.auth.mfa.challenge({ factorId });
            if (chErr) throw chErr;
            const { error: vErr } = await sb.auth.mfa.verify({ factorId, challengeId: ch.id, code });
            if (vErr) throw vErr;
            boot();
          } catch (e) { error = e.message; loading = false; paint(); }
        },
      }, loading ? 'جارٍ التحقق…' : 'تأكيد'),
    ]);
    app.appendChild(h('div', { class: 'auth-screen' }, box));
  }
  paint();
}

// Builds the capability-gated back-office nav items appended after the
// practitioner section — a section is entirely omitted if the viewer
// holds none of its items' capabilities, an item is omitted individually
// otherwise. This is the only place backoffice-portal's NAV_SECTIONS
// filtering logic is reimplemented; keep the capability lists in sync
// with role_capabilities if the seed matrix ever changes.
function renderAdminNavSections(route) {
  const caps = viewer?.capabilities || new Set();
  const out = [];
  for (const section of ADMIN_NAV_SECTIONS) {
    const items = section.items.filter((item) => item.anyOf.some((cap) => caps.has(cap)));
    if (items.length === 0) continue;
    out.push(h('div', { class: 'nav-section-title' }, section.title));
    for (const item of items) {
      out.push(h('div', { class: `nav-item ${route.startsWith(item.href) ? 'active' : ''}` },
        h('button', { onclick: () => (location.hash = item.href) }, h('span', {}, item.label))));
    }
  }
  return out;
}

// ---------- urgent alerts (notifications) ----------
// Hearings within 3 days + deadlines due within 3 days (including already
// overdue ones) — real RLS-scoped queries, not a client-side filter over
// preloaded data. RLS already restricts this to matters the viewer has
// access to, so unlike the design reference there is no separate "mine
// only" concept to port: everything returned here is already "mine" in
// the access sense.
async function getUrgentAlerts() {
  const today = todayISO();
  const horizon = addDaysISO(today, 3);
  try {
    const [hearingsRes, deadlinesRes] = await Promise.all([
      sb.from('hearings')
        .select('id, matter_id, session_date, session_time, adjournment_reason, matters(matter_label, court, circuit, case_number, case_year)')
        .gte('session_date', today).lte('session_date', horizon)
        .order('session_date', { ascending: true }),
      sb.from('deadlines')
        .select('id, matter_id, trigger_event, computed_due_date, status, matters(matter_label, case_number, case_year)')
        .in('status', ['provisional', 'confirmed']).lte('computed_due_date', horizon)
        .order('computed_due_date', { ascending: true }),
    ]);
    const hearings = (hearingsRes.data || []).map((h) => ({
      type: 'hearing', id: h.id, matterId: h.matter_id, matter: h.matters,
      days: daysUntil(h.session_date), date: h.session_date, time: h.session_time, reason: h.adjournment_reason,
    }));
    const deadlines = (deadlinesRes.data || []).map((d) => ({
      type: 'deadline', id: d.id, matterId: d.matter_id, matter: d.matters,
      days: daysUntil(d.computed_due_date), date: d.computed_due_date, title: d.trigger_event, status: d.status,
    }));
    const all = [...hearings, ...deadlines].sort((a, b) => a.days - b.days);
    return { hearings, deadlines, all, totalCount: all.length };
  } catch {
    return { hearings: [], deadlines: [], all: [], totalCount: 0 };
  }
}

function renderNotifDropdown(alerts) {
  const dd = h('div', { class: 'notif-dropdown' }, []);
  dd.appendChild(h('div', { class: 'notif-header' }, [
    h('span', {}, [icon('bell'), ' التنبيهات العاجلة (أقل من ٣ أيام)']),
    h('span', { class: `chip ${alerts.totalCount > 0 ? 'chip-overdue-days' : 'chip-confirmed'}` }, [bdi(alerts.totalCount), ' تنبيهات']),
  ]));
  const list = h('div', { class: 'notif-list' }, []);
  if (alerts.all.length === 0) {
    list.appendChild(h('div', { style: 'padding:24px; text-align:center; color:var(--text-dim); font-size:13px' }, 'لا توجد جلسات أو مواعيد عاجلة خلال الـ ٣ أيام القادمة.'));
  } else {
    for (const item of alerts.all) {
      const isOverdue = item.type === 'deadline' && item.days < 0;
      const isUrgent = isOverdue || item.days <= 1;
      const tag = isOverdue ? ['متأخر ', bdi(Math.abs(item.days)), ' يوم'] : (item.days === 0 ? 'اليوم' : ['متبقي ', bdi(item.days), ' يوم']);
      const row = h('div', { class: 'notif-item' }, [
        h('div', { class: `notif-item-icon ${isUrgent ? 'danger' : 'warn'}` }, icon(item.type === 'hearing' ? 'clock' : 'clock')),
        h('div', { style: 'flex:1; min-width:0' }, [
          h('div', { style: 'display:flex; align-items:center; justify-content:space-between; gap:6px' }, [
            h('span', { class: 'notif-item-title' }, item.type === 'hearing' ? ['جلسة: ', item.matter?.matter_label || ''] : (item.title || item.matter?.matter_label || '')),
            h('span', { class: `chip ${isOverdue ? 'chip-overdue-days' : isUrgent ? 'chip-provisional' : 'chip-stage'}`, style: 'font-size:10px' }, tag),
          ]),
          h('div', { class: 'notif-item-meta' }, item.type === 'hearing'
            ? `${item.matter?.court || ''} (${item.matter?.circuit || ''}) — ${item.time || ''}`
            : `${item.matter?.matter_label || ''} — ${fmtDate(item.date)}`),
          item.type === 'hearing' && item.reason ? h('div', { style: 'font-size:11px; color:var(--text); margin-block-start:2px' }, ['قرار الجلسة السابقة: ', item.reason]) : null,
          item.type === 'deadline' && item.status === 'provisional' ? h('div', { style: 'margin-block-start:6px' }, h('button', {
            class: 'btn btn-good btn-sm', style: 'font-size:11px; padding:2px 8px',
            onclick: async (e) => {
              e.stopPropagation(); e.target.disabled = true;
              try { await callFunction('litigation-confirm-deadline', { deadline_id: item.id }); showToast('تم تأكيد الميعاد'); await renderShell(location.hash); route(); }
              catch (err) { showToast(err.message); e.target.disabled = false; }
            },
          }, 'تأكيد الميعاد الآن')) : null,
        ]),
      ]);
      row.addEventListener('click', () => { location.hash = item.type === 'hearing' ? '#/roll' : `#/matters/${item.matterId}`; });
      list.appendChild(row);
    }
  }
  dd.appendChild(list);
  dd.appendChild(h('div', { class: 'notif-footer' }, [
    h('button', { class: 'btn btn-outline btn-sm', style: 'font-size:12px', onclick: () => (location.hash = '#/roll') }, 'رول الجلسات'),
    h('button', { class: 'btn btn-outline btn-sm', style: 'font-size:12px', onclick: () => (location.hash = '#/deadlines') }, 'كافة المواعيد'),
  ]));
  return dd;
}

function buildNotifBell(alerts) {
  const wrapper = h('div', { class: 'notif-wrapper' }, []);
  let open = false;
  const bell = h('button', { class: 'icon-btn', title: 'تنبيهات الجلسات والمواعيد القريبة (أقل من ٣ أيام)' }, [
    icon('bell'),
    alerts.totalCount > 0 ? h('span', { class: 'notif-badge' }, bdi(alerts.totalCount)) : null,
  ]);
  function onOutsideClick(e) { if (!wrapper.contains(e.target)) close(); }
  function close() {
    if (!open) return;
    open = false;
    const dd = wrapper.querySelector('.notif-dropdown');
    if (dd) dd.remove();
    document.removeEventListener('click', onOutsideClick);
  }
  bell.addEventListener('click', (e) => {
    e.stopPropagation();
    if (open) { close(); return; }
    open = true;
    wrapper.appendChild(renderNotifDropdown(alerts));
    document.addEventListener('click', onOutsideClick);
  });
  wrapper.appendChild(bell);
  return wrapper;
}

      }, 'تأكيد الميعاد'),
    ]));

// ---------- hearing roll (firm-wide calendar) ----------
let rollSelectedDate = null;
async function renderHearingRollScreen(content) {
  clear(content);
  if (!rollSelectedDate) rollSelectedDate = todayISO();
  const [y, mo] = rollSelectedDate.split('-').map(Number);

  content.appendChild(h('div', { class: 'page-header' }, h('div', {}, [
    h('h1', { class: 'page-title' }, 'رول الجلسات والأجندة القضائية'),
    h('div', { class: 'page-subtitle' }, 'جدول جلسات كل القضايا المتاحة لك عبر كل المحاكم'),
  ])));

  const body = h('div', {}, h('p', { class: 'empty-note' }, 'جارٍ التحميل…'));
  content.appendChild(body);

  const monthStart = `${y}-${String(mo).padStart(2, '0')}-01`;
  const monthEnd = new Date(y, mo, 0).toISOString().slice(0, 10); // last day of month
  const [monthHearingsRes, dayHearingsRes] = await Promise.all([
    sb.from('hearings').select('session_date').gte('session_date', monthStart).lte('session_date', monthEnd),
    sb.from('hearings').select('id, session_time, adjournment_reason, matter_id, matters(matter_label, court, circuit, case_number, case_year)').eq('session_date', rollSelectedDate).order('session_time'),
  ]);

  clear(body);
  const hearingDates = new Set((monthHearingsRes.data || []).map((h2) => h2.session_date));
  const daysInMonth = new Date(y, mo, 0).getDate();
  const firstDow = new Date(monthStart).getDay(); // 0=Sunday; sidebar week starts Saturday per RTL convention below
  const leadBlanks = (firstDow + 1) % 7; // shift so Saturday=0

  const calCard = h('div', { class: 'calendar-card' }, []);
  calCard.appendChild(h('div', { class: 'cal-header' }, [
    h('h3', { class: 'doc-heading', style: 'font-size:16px' }, new Date(monthStart).toLocaleDateString(localeTag(), { month: 'long', year: 'numeric' })),
    h('div', { style: 'display:flex; gap:6px' }, [
      h('button', { class: 'btn btn-outline btn-sm', onclick: () => { rollSelectedDate = addDaysISO(monthStart, -1); renderHearingRollScreen(content); } }, '‹'),
      h('button', { class: 'btn btn-outline btn-sm', onclick: () => { rollSelectedDate = todayISO(); renderHearingRollScreen(content); } }, 'اليوم'),
      h('button', { class: 'btn btn-outline btn-sm', onclick: () => { rollSelectedDate = addDaysISO(monthEnd, 1); renderHearingRollScreen(content); } }, '›'),
    ]),
  ]));
  const grid = h('div', { class: 'cal-grid' }, []);
  for (const dn of ['سبت', 'أحد', 'إثنين', 'ثلاثاء', 'أربعاء', 'خميس', 'جمعة']) grid.appendChild(h('div', { class: 'cal-day-name' }, dn));
  for (let i = 0; i < leadBlanks; i++) grid.appendChild(h('div', {}, ''));
  for (let d = 1; d <= daysInMonth; d++) {
    const dStr = `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    grid.appendChild(h('div', {
      class: `cal-day-cell ${dStr === rollSelectedDate ? 'selected' : ''} ${hearingDates.has(dStr) ? 'has-hearings' : ''}`,
      onclick: () => { rollSelectedDate = dStr; renderHearingRollScreen(content); },
    }, bdi(d)));
  }
  calCard.appendChild(grid);

  const agenda = h('div', { class: 'dash-panel' }, [
    h('div', { class: 'panel-head' }, [
      h('div', { class: 'panel-title' }, ['أجندة يوم: ', bdi(rollSelectedDate)]),
      h('span', { class: 'panel-count' }, [bdi((dayHearingsRes.data || []).length), ' جلسة']),
    ]),
  ]);
  const agendaList = h('div', { class: 'timeline-list' }, []);
  const dayHearings = dayHearingsRes.data || [];
  if (dayHearings.length === 0) agendaList.appendChild(h('p', { class: 'empty-note', style: 'text-align:center; padding:32px' }, 'لا توجد جلسات مجدولة في هذا اليوم.'));
  for (const hEntry of dayHearings) {
    const m = hEntry.matters || {};
    agendaList.appendChild(h('div', { class: 'timeline-item' }, [
      h('div', { class: 'time-badge' }, bdi(hEntry.session_time ? hEntry.session_time.slice(0, 5) : '—')),
      h('div', { class: 'timeline-content' }, [
        h('div', { class: 'timeline-matter-num', onclick: () => (location.hash = `#/matters/${hEntry.matter_id}`) }, `${m.matter_label || 'قضية'} — ${m.court || ''} (${m.circuit || ''})`),
        hEntry.adjournment_reason ? h('div', { class: 'timeline-sub' }, [h('strong', {}, 'قرار الجلسة السابقة: '), hEntry.adjournment_reason]) : null,
      ]),
    ]));
  }
  agenda.appendChild(agendaList);

  body.appendChild(h('div', { class: 'roll-layout' }, [calCard, agenda]));
}

// ---------- deadlines (firm-wide) ----------
async function renderDeadlinesScreen(content) {
  clear(content);
  content.appendChild(h('div', { class: 'page-header' }, h('div', {}, [
    h('h1', { class: 'page-title' }, 'حساب ومراقبة المواعيد الإجرائية'),
    h('div', { class: 'page-subtitle' }, 'مواعيد كل القضايا المتاحة لك، مقسّمة حسب الأولوية'),
  ])));
  const body = h('div', {}, h('p', { class: 'empty-note' }, 'جارٍ التحميل…'));
  content.appendChild(body);

  const { data, error } = await sb
    .from('deadlines')
    .select('id, trigger_event, computed_due_date, status, matter_id, matters(matter_label, case_number, case_year)')
    .in('status', ['provisional', 'confirmed'])
    .order('computed_due_date', { ascending: true });

  clear(body);
  if (error) { body.appendChild(h('div', { class: 'form-error' }, ['تعذّر التحميل: ', error.message])); return; }

  const today = todayISO();
  const rows = data || [];
  const overdue = rows.filter((d) => d.computed_due_date < today);
  const thisWeek = rows.filter((d) => d.computed_due_date >= today && daysUntil(d.computed_due_date) <= 7);
  const upcoming = rows.filter((d) => daysUntil(d.computed_due_date) > 7);

  function group(items, title, borderClass) {
    const wrap = h('div', { style: 'margin-block-end:24px' }, []);
    wrap.appendChild(h('div', { style: 'display:flex; align-items:center; gap:10px; margin-block-end:12px' }, [
      h('h3', { class: 'doc-heading', style: 'font-size:18px' }, title),
      h('span', { class: 'chip chip-stage' }, bdi(items.length)),
    ]));
    if (items.length === 0) { wrap.appendChild(h('p', { class: 'empty-note' }, 'لا توجد مواعيد في هذا القسم.')); return wrap; }
    const list = h('div', { style: 'display:flex; flex-direction:column; gap:10px' }, []);
    for (const dl of items) {
      const m = dl.matters || {};
      const days = daysUntil(dl.computed_due_date);
      const isProvisional = dl.status === 'provisional';
      list.appendChild(h('div', { class: `deadline-row ${borderClass}` }, [
        h('div', { class: 'deadline-info' }, [
          h('div', { style: 'display:flex; align-items:center; justify-content:space-between; gap:8px' }, [
            h('span', { class: 'deadline-title' }, dl.trigger_event),
            h('span', { class: `chip ${isProvisional ? 'chip-provisional' : 'chip-confirmed'}` }, isProvisional ? 'مبدئي (يتطلب تأكيد)' : 'مؤكد'),
          ]),
          h('div', { class: 'deadline-meta' }, [
            h('span', { style: 'cursor:pointer', onclick: () => (location.hash = `#/matters/${dl.matter_id}`) }, [h('strong', {}, 'القضية: '), m.matter_label || '']),
            h('span', {}, ['الاستحقاق: ', bdi(fmtDate(dl.computed_due_date))]),
            h('span', {}, ['المتبقي: ', days < 0 ? 'متأخر ' : '', bdi(Math.abs(days)), days < 0 ? ' يوم' : ' أيام']),
          ]),
        ]),
        isProvisional ? h('button', {
          class: 'btn btn-good btn-sm',
          onclick: async (e) => {
            e.target.disabled = true;
            try { await callFunction('litigation-confirm-deadline', { deadline_id: dl.id }); showToast('تم تأكيد الميعاد'); renderDeadlinesScreen(content); }
            catch (err) { showToast(err.message); e.target.disabled = false; }
          },
        }, 'تأكيد الميعاد') : null,
      ]));
    }
    wrap.appendChild(list);
    return wrap;
  }

  body.appendChild(group(overdue, 'مواعيد متأخرة', 'overdue'));
  body.appendChild(group(thisWeek, 'مواعيد هذا الأسبوع', 'this-week'));
  body.appendChild(group(upcoming, 'مواعيد قادمة', 'upcoming'));
}

// Every field below is required (parties excepted) — litigation-create-matter
// enforces the same list server-side; this is the client-side mirror of
// that, not a stand-in for it. REQUIRED_FIELDS drives both the label
// markers and the pre-submit check, so the two can't drift apart. subject
// is checked separately in the submit handler below, since whether it's
// required depends on the subjectMode toggle.
const NEW_MATTER_REQUIRED_FIELDS = [
  ['matter_label', 'عنوان القضية'], ['court', 'المحكمة'], ['circuit', 'الدائرة'],
  ['case_number', 'رقم القضية'], ['case_year', 'السنة'], ['matter_type', 'نوع القضية'],
  ['stage', 'المرحلة'],
];

// subjectMode: 'text' (type it now, the default) or 'documents' (skip it —
// upload the case's own scanned documents right after creation instead).
// The 'documents' path sends subject_pending_documents:true and leaves
// subject genuinely unset server-side (see litigation-create-matter) —
// never a placeholder string — then opens the upload dialog immediately
// on success so the choice actually leads somewhere, rather than creating
// an incomplete matter and leaving the user to find the Documents tab.
function openNewMatterDialog() {
  const overlay = h('div', { class: 'modal-overlay', onclick: (e) => { if (e.target === overlay) overlay.remove(); } }, []);
  document.body.appendChild(overlay);
  let form = { matter_label: '', court: '', circuit: '', case_number: '', case_year: '', matter_type: '', stage: '', subject: '' };
  let subjectMode = 'text';
  let error = null, loading = false;

  function paint() {
    clear(overlay);
    overlay.appendChild(h('div', { class: 'modal-card' }, [
      h('h2', {}, 'قضية جديدة'),
      h('p', { class: 'form-hint' }, 'إدخال يدوي — بديل مؤقت لاستيراد الملف الممسوح ضوئياً عبر legal-extract. كل الحقول أدناه مطلوبة.'),
      error ? h('div', { class: 'form-error' }, error) : null,
      h('div', { class: 'form-group' }, [h('label', { class: 'form-label' }, 'عنوان القضية *'),
        h('input', { class: 'form-input', value: form.matter_label, oninput: (e) => (form.matter_label = e.target.value) })]),
      h('div', { class: 'form-row-2' }, [
        h('div', { class: 'form-group' }, [h('label', { class: 'form-label' }, 'المحكمة *'), h('input', { class: 'form-input', value: form.court, oninput: (e) => (form.court = e.target.value) })]),
        h('div', { class: 'form-group' }, [h('label', { class: 'form-label' }, 'الدائرة *'), h('input', { class: 'form-input', value: form.circuit, oninput: (e) => (form.circuit = e.target.value) })]),
        h('div', { class: 'form-group' }, [h('label', { class: 'form-label' }, 'رقم القضية *'), h('input', { class: 'form-input', value: form.case_number, oninput: (e) => (form.case_number = e.target.value) })]),
        h('div', { class: 'form-group' }, [h('label', { class: 'form-label' }, 'السنة *'), h('input', { class: 'form-input', type: 'number', value: form.case_year, oninput: (e) => (form.case_year = e.target.value) })]),
        h('div', { class: 'form-group' }, [h('label', { class: 'form-label' }, 'نوع القضية *'), h('input', { class: 'form-input', value: form.matter_type, oninput: (e) => (form.matter_type = e.target.value), placeholder: 'مثال: مدني، جنائي، تجاري…' })]),
        h('div', { class: 'form-group' }, [
          h('label', { class: 'form-label' }, 'المرحلة *'),
          h('select', { class: 'form-select', onchange: (e) => (form.stage = e.target.value) }, [
            h('option', { value: '', selected: form.stage === '' ? 'true' : null }, '—'),
            ...Object.entries(STAGE_LABELS).map(([v, l]) => h('option', { value: v, selected: form.stage === v ? 'true' : null }, l)),
          ]),
        ]),
      ]),
      h('div', { class: 'form-group' }, [
        h('label', { class: 'form-label' }, 'الموضوع *'),
        h('div', { style: 'display:flex; gap:8px; margin-block-end:8px' }, [
          h('button', { class: `btn btn-sm ${subjectMode === 'text' ? 'btn-primary' : 'btn-outline'}`, onclick: () => { subjectMode = 'text'; paint(); } }, 'نص حر'),
          h('button', { class: `btn btn-sm ${subjectMode === 'documents' ? 'btn-primary' : 'btn-outline'}`, onclick: () => { subjectMode = 'documents'; paint(); } }, 'رفع مستندات بدلاً من ذلك'),
        ]),
        subjectMode === 'text'
          ? h('textarea', { class: 'form-textarea', rows: '3', value: form.subject, oninput: (e) => (form.subject = e.target.value) })
          : h('p', { class: 'form-hint' }, 'ستُنشأ القضية بلا موضوع نصي، وستُفتح نافذة رفع المستندات (عدة ملفات دفعة واحدة) مباشرة بعد الإنشاء — إن استخرج التحليل موضوعاً بثقة عالية من المستندات فسيُملأ تلقائياً، وإلا يمكن كتابته يدوياً لاحقاً من تبويب "نظرة عامة".'),
      ]),
      h('div', { class: 'page-header', style: 'margin:0' }, [
        h('button', { class: 'btn btn-outline', onclick: () => overlay.remove() }, 'إلغاء'),
        h('button', {
          class: 'btn btn-primary', disabled: loading ? 'true' : null,
          onclick: async () => {
            error = null;
            const missing = NEW_MATTER_REQUIRED_FIELDS.find(([key]) => !String(form[key] ?? '').trim());
            if (missing) { error = `${missing[1]} مطلوب`; paint(); return; }
            if (subjectMode === 'text' && !form.subject.trim()) { error = 'الموضوع مطلوب — اكتبه، أو اختر "رفع مستندات بدلاً من ذلك"'; paint(); return; }
            loading = true; paint();
            try {
              const payload = subjectMode === 'documents'
                ? { ...form, subject: undefined, subject_pending_documents: true, case_year: Number(form.case_year) }
                : { ...form, case_year: Number(form.case_year) };
              const res = await callFunction('litigation-create-matter', payload);
              overlay.remove();
              location.hash = `#/matters/${res.matter_id}`;
              route();
              if (subjectMode === 'documents') {
                // Navigate first, so cancelling the upload dialog below
                // still lands on the (now-existing) matter's own page —
                // not nowhere. onDone re-renders that same page instead
                // of re-navigating, matching the Overview tab's own
                // upload button.
                openUploadDialog(res.matter_id, () => renderMatterDetail(document.getElementById('content'), res.matter_id));
              }
            } catch (e) { error = e.message; loading = false; paint(); }
          },
        }, loading ? 'جارٍ الحفظ…' : 'إنشاء'),
      ]),
    ]));
  }
  paint();
}

        h('div', { class: 'form-group' }, [h('label', { class: 'form-label' }, 'الدائرة *'), h('input', { class: 'form-input', value: form.circuit, oninput: (e) => (form.circuit = e.target.value) })]),

          ]),

      ]),
      h('div', { class: 'form-group' }, [

      ]),
      h('div', { class: 'page-header', style: 'margin:0' }, [

// ---------- matter detail ----------
let matterTabState = {};

async function renderMatterDetail(content, matterId) {
  clear(content);
  content.appendChild(h('p', { class: 'empty-note' }, 'جارٍ التحميل…'));

  const [matterRes, partiesRes, hearingsRes, deadlinesRes, docsRes, activeRulesRes] = await Promise.all([
    sb.from('matters').select('*').eq('id', matterId).maybeSingle(),
    sb.from('matter_parties').select('*').eq('matter_id', matterId),
    sb.from('hearings').select('*').eq('matter_id', matterId).order('session_date', { ascending: false }),
    sb.from('deadlines').select('*').eq('matter_id', matterId).order('computed_due_date', { ascending: true }),
    sb.from('documents').select('id, original_filename, ocr_status, created_at, storage_path').eq('matter_id', matterId),
    sb.from('deadline_rules').select('id, rule_key, title_ar, title_en').eq('status', 'active'),
  ]);

  clear(content);
  if (matterRes.error || !matterRes.data) {
    content.appendChild(h('div', { class: 'form-error' }, 'تعذّر الوصول لهذه القضية — إما غير موجودة أو لا تملك صلاحية وصول (matter_access) لها.'));
    return;
  }
  const m = matterRes.data;

        h('td', {}, h('span', { class: `chip ${d.status === 'exported' ? 'chip-confirmed' : 'chip-provisional'}` }, d.status)),
        h('td', {}, bdi(fmtDate(d.created_at))),

          class: 'btn btn-outline btn-sm',
