// ---------- citation & provision inspector ----------
// Shows every draft_citations row for one draft side-by-side against the
// verbatim authority_chunk text it's actually bound to, so a lawyer can
// confirm the citation says what the draft claims it says before export
// (litigation-export-draft already blocks export on any unverified/flagged
// row — this is the screen that resolves them). A citation with no bound
// chunk can only be flagged, never verified: there is nothing retrieved to
// check it against.
function openCitationInspector(draftId, onDone) {
  const overlay = h('div', { class: 'modal-overlay', onclick: (e) => { if (e.target === overlay) overlay.remove(); } }, []);
  document.body.appendChild(overlay);
  let citations = null, error = null, busyId = null;

  async function load() {
    error = null; paint();
    const { data, error: err } = await sb
      .from('draft_citations')
      .select('id, citation_text, status, authority_chunk_id, authority_chunks(chunk_text, chunk_ref, authorities(title, citation, verification_status, repealed_date, madhhab))')
      .eq('draft_id', draftId)
      .order('created_at', { ascending: true });
    if (err) { error = err.message; paint(); return; }
    citations = data; paint();
  }

  async function setStatus(citationId, status) {
    busyId = citationId; paint();
    try {
      await callFunction('litigation-verify-citation', { citation_id: citationId, status });
      showToast(status === 'verified' ? 'تم تحديد الاستشهاد كموثّق' : 'تم تحديد الاستشهاد كمشكوك فيه');
      busyId = null; await load(); onDone();
    } catch (e) { showToast(e.message); busyId = null; paint(); }
  }

  function paint() {
    clear(overlay);
    const card = h('div', { class: 'modal-card modal-card-wide' }, []);
    card.appendChild(h('div', { class: 'page-header', style: 'margin:0' }, [
      h('h2', {}, 'فحص الاستشهادات'),
      h('button', { class: 'btn btn-outline btn-sm', onclick: () => overlay.remove() }, 'إغلاق'),
    ]));
    card.appendChild(h('p', { class: 'form-hint' }, 'كل بطاقة تعرض نص الاستشهاد كما ورد في المسودة، جنباً إلى جنب مع النص الحرفي للمقطع المسترجع من المصادر القانونية الذي استُند إليه.'));
    if (error) card.appendChild(h('div', { class: 'form-error' }, error));
    if (citations === null) { card.appendChild(h('p', { class: 'empty-note' }, 'جارٍ التحميل…')); overlay.appendChild(card); return; }
    if (citations.length === 0) { card.appendChild(h('p', { class: 'empty-note' }, 'لا توجد استشهادات على هذه المسودة.')); overlay.appendChild(card); return; }

    for (const c of citations) {
      const chunk = c.authority_chunks;
      const authority = chunk?.authorities;
      const bound = !!chunk;
      const inner = [
        h('div', { style: 'display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap' }, [
          h('span', { class: `chip ${CITATION_STATUS_CHIP_CLASS[c.status] || 'chip-stage'}` }, CITATION_STATUS_LABELS[c.status] || c.status),
          authority ? h('div', { style: 'display:flex; gap:6px; flex-wrap:wrap' }, [
            h('span', { class: `chip ${VERIFICATION_CHIP_CLASS[authority.verification_status]}` }, VERIFICATION_LABELS[authority.verification_status] || authority.verification_status),
            authority.repealed_date ? h('span', { class: 'chip chip-danger' }, ['ملغى ', bdi(fmtDate(authority.repealed_date))]) : null,
            authority.madhhab ? h('span', { class: 'chip chip-stage' }, authority.madhhab) : null,
          ]) : null,
        ]),
        h('div', { class: 'citation-inspect-grid' }, [
          h('div', { class: 'citation-inspect-col' }, [h('h4', {}, 'نص الاستشهاد في المسودة'), h('p', {}, c.citation_text)]),
          h('div', { class: 'citation-inspect-col' }, bound
            ? [
                h('h4', {}, `النص الحرفي المسترجع — ${authority.title} (${authority.citation})${chunk.chunk_ref ? ' — ' + chunk.chunk_ref : ''}`),
                h('p', {}, chunk.chunk_text),
              ]
            : [h('h4', {}, 'النص الحرفي المسترجع'), h('p', { class: 'citation-inspect-unbound' }, 'غير مرتبط بمقطع مسترجع — لا يمكن التحقق منه ولا تحديده كموثّق، فقط كمشكوك فيه.')]),
        ]),
        h('div', { style: 'display:flex; gap:8px' }, [
          h('button', {
            class: 'btn btn-good btn-sm', disabled: (!bound || busyId === c.id) ? 'true' : null,
            onclick: () => setStatus(c.id, 'verified'),
          }, busyId === c.id ? '…' : 'تحديد كموثّق'),
          h('button', {
            class: 'btn btn-outline btn-sm', disabled: busyId === c.id ? 'true' : null,
            onclick: () => setStatus(c.id, 'flagged'),
          }, busyId === c.id ? '…' : 'تحديد كمشكوك فيه'),
        ]),
      ];
      card.appendChild(h('div', { class: 'citation-inspect-card' }, inner));
    }
    overlay.appendChild(card);
  }
  paint();
  load();
}

function openGenerateDraftDialog(matterId, onDone) {
  const overlay = h('div', { class: 'modal-overlay', onclick: (e) => { if (e.target === overlay) overlay.remove(); } }, []);
  document.body.appendChild(overlay);
  let form = { doc_type: '', template_id: '', instructions: '' };
  let templates = [], error = null, loading = false, status = null;

  async function init() {
    const { data } = await sb.from('templates').select('id, title, doc_type').eq('active', true);
    templates = data || [];
    paint();
  }

  function paint() {
    clear(overlay);
    overlay.appendChild(h('div', { class: 'modal-card' }, [
      h('h2', {}, 'إنشاء مسودة'),
      error ? h('div', { class: 'form-error' }, error) : null,
      status ? h('div', { class: 'form-hint', style: 'color:var(--good)' }, status) : null,
      h('div', { class: 'form-group' }, [h('label', { class: 'form-label' }, 'نوع المستند *'),
        h('input', { class: 'form-input', placeholder: 'مثال: صحيفة دعوى', oninput: (e) => (form.doc_type = e.target.value) })]),
      h('div', { class: 'form-group' }, [
        h('label', { class: 'form-label' }, 'القالب (اختياري)'),
        h('select', { class: 'form-select', onchange: (e) => (form.template_id = e.target.value) }, [
          h('option', { value: '' }, '— بدون قالب —'),
          ...templates.map((t) => h('option', { value: t.id }, `${t.title} (${t.doc_type})`)),
        ]),
      ]),
      h('div', { class: 'form-group' }, [h('label', { class: 'form-label' }, 'تعليمات إضافية'), h('textarea', { class: 'form-textarea', rows: '3', oninput: (e) => (form.instructions = e.target.value) })]),
      h('div', { class: 'page-header', style: 'margin:0' }, [
        h('button', { class: 'btn btn-outline', onclick: () => overlay.remove() }, 'إلغاء'),
        h('button', {
          class: 'btn btn-primary', disabled: loading ? 'true' : null,
          onclick: async () => {
            error = null;
            if (!form.doc_type.trim()) { error = 'نوع المستند مطلوب'; paint(); return; }
            loading = true; status = 'جارٍ التوليد (Gemini)…'; paint();
            try {
              await callFunction('litigation-draft', {
                matter_id: matterId, doc_type: form.doc_type,
                template_id: form.template_id || undefined, instructions: form.instructions || undefined,
              });
              overlay.remove(); onDone();
            } catch (e) { error = e.message; loading = false; status = null; paint(); }
          },
        }, status || 'توليد'),
      ]),
    ]));
  }
  paint();
  init();
}

// ---------- legal memo & analysis builder ----------
// A distinct workflow from openGenerateDraftDialog: not "draft this
// pleading from a template", but "answer this legal question about the
// matter as a structured IRAC memo, grounded only in retrieved
// authorities". Same fabrication guard as litigation-research: if
// retrieval finds nothing, litigation-memo creates no draft at all and
// returns a note instead — this dialog stays open and shows it rather
// than silently closing on an empty result.
const MEMO_AUTHORITY_TYPES = [
  ['statute', 'تشريع'], ['cassation_principle', 'مبدأ نقض'], ['regulation', 'لائحة'], ['fiqh_doctrine', 'فقه إسلامي'],
];

function openGenerateMemoDialog(matterId, onDone) {
  const overlay = h('div', { class: 'modal-overlay', onclick: (e) => { if (e.target === overlay) overlay.remove(); } }, []);
  document.body.appendChild(overlay);
  let form = { question: '', authority_types: new Set(), verified_only: false };
  let error = null, note = null, loading = false, status = null;

  function paint() {
    clear(overlay);
    overlay.appendChild(h('div', { class: 'modal-card' }, [
      h('h2', {}, 'إنشاء مذكرة قانونية'),

      h('div', { class: 'form-group' }, [

        h('input', { type: 'checkbox', checked: form.verified_only ? 'true' : null, onchange: (e) => (form.verified_only = e.target.checked) }),

          onclick: async () => {
            error = null; note = null;

            loading = true; status = 'جارٍ البحث والتوليد (Gemini)…'; paint();
            try {
              const res = await callFunction('litigation-memo', {
                matter_id: matterId, question: form.question,

                note = res.note || 'لم يتم العثور على مصادر مطابقة — لم تُنشأ أي مذكرة.'; loading = false; status = null; paint(); return;

              overlay.remove(); onDone();

  }

}

// ---------- template variable fill (deterministic, non-AI) ----------
// A third drafting path alongside openGenerateDraftDialog (AI, from a
// template used as style reference) and openGenerateMemoDialog (AI,
// grounded research memo): plain {{var}} substitution, no model call at
// all. Every variable below traces to a real column — matters,
// matter_parties, the nearest upcoming hearing, or the viewer's own
// profile — except claim_amount/opponent_address/court_address, which
// have no column anywhere in this schema and so are always left for the
// lawyer to type in by hand. Mirrors litigation-fill-template's own
// variable set and MISSING placeholder exactly; what actually gets
// persisted is recomputed server-side from the submitted variables, not
// from this preview's rendered text.
const FILL_VAR_KEYS = [
  'matter_label', 'court', 'circuit', 'case_number', 'case_year', 'stage', 'subject',
  'plaintiff_name', 'defendant_name', 'next_hearing_date', 'lawyer_name', 'date',
  'claim_amount', 'opponent_address', 'court_address',
];
const FILL_VAR_LABELS = {
  matter_label: 'اسم القضية', court: 'المحكمة', circuit: 'الدائرة', case_number: 'رقم القضية', case_year: 'السنة',
  stage: 'المرحلة', subject: 'الموضوع', plaintiff_name: 'اسم المدعي', defendant_name: 'اسم المدعى عليه',
  next_hearing_date: 'تاريخ الجلسة القادمة', lawyer_name: 'المحامي المحرِّر', date: 'تاريخ التحرير',
  claim_amount: 'قيمة المطالبة (لا يوجد حقل بقاعدة البيانات)', opponent_address: 'موطن إعلان الخصم (لا يوجد حقل بقاعدة البيانات)',
  court_address: 'مقر المحكمة (لا يوجد حقل بقاعدة البيانات)',
};
const FILL_MISSING = '[يُستكمل يدوياً]';

function renderFilledPreview(templateText, vars) {
  let out = String(templateText || '');
  for (const key of FILL_VAR_KEYS) {
    const value = vars[key] && vars[key].trim() ? vars[key] : FILL_MISSING;
    out = out.split(`{{${key}}}`).join(value);
  }
  return out;
}

// Builds real text nodes (never innerHTML) and wraps only the fixed
// FILL_MISSING literal in a highlight span — the surrounding text is
// user/database-sourced and must never be interpreted as markup.
function appendHighlighted(container, text) {
  const parts = text.split(FILL_MISSING);
  parts.forEach((part, i) => {
    if (part) container.appendChild(document.createTextNode(part));
    if (i < parts.length - 1) container.appendChild(h('span', { class: 'legal-token-missing' }, FILL_MISSING));
  });
}

async function openFillTemplateDialog(matterId, onDone) {
  const overlay = h('div', { class: 'modal-overlay', onclick: (e) => { if (e.target === overlay) overlay.remove(); } }, []);
  document.body.appendChild(overlay);
  overlay.appendChild(h('div', { class: 'modal-card modal-card-wide' }, h('p', { class: 'empty-note' }, 'جارٍ التحميل…')));

  let error = null, loading = false, status = null;
  const today = todayISO();

  const [{ data: tpls }, { data: matter }, { data: parties }, { data: nextHearing }] = await Promise.all([
    sb.from('templates').select('id, title, doc_type, content_text').eq('active', true),
    sb.from('matters').select('matter_label, court, circuit, case_number, case_year, stage, subject').eq('id', matterId).maybeSingle(),
    sb.from('matter_parties').select('party_role, name').eq('matter_id', matterId).in('party_role', ['plaintiff', 'defendant']).order('created_at', { ascending: true }),
    sb.from('hearings').select('session_date').eq('matter_id', matterId).gte('session_date', today).order('session_date', { ascending: true }).limit(1).maybeSingle(),
  ]);
  const templates = tpls || [];
  let templateId = templates[0]?.id || '';
  const plaintiff = (parties || []).find((p) => p.party_role === 'plaintiff');
  const defendant = (parties || []).find((p) => p.party_role === 'defendant');
  const vars = {
    matter_label: matter?.matter_label || '', court: matter?.court || '', circuit: matter?.circuit || '',
    case_number: matter?.case_number || '', case_year: matter?.case_year != null ? String(matter.case_year) : '',
    stage: matter?.stage ? (STAGE_LABELS[matter.stage] || matter.stage) : '', subject: matter?.subject || '',
    plaintiff_name: plaintiff?.name || '', defendant_name: defendant?.name || '',
    next_hearing_date: nextHearing?.session_date || '', lawyer_name: viewer?.fullName || '', date: today,
    claim_amount: '', opponent_address: '', court_address: '',
  };

  function currentTemplate() { return templates.find((t) => t.id === templateId) || null; }

  function updatePreviewOnly() {
    const tpl = currentTemplate();
    const body = document.getElementById('fill-template-body');
    if (body && tpl) { clear(body); appendHighlighted(body, renderFilledPreview(tpl.content_text, vars)); }
  }

  function paint() {
    clear(overlay);
    const card = h('div', { class: 'modal-card modal-card-wide' }, []);
    card.appendChild(h('h2', {}, 'إنشاء مسودة من قالب (بلا ذكاء اصطناعي)'));
    card.appendChild(h('p', { class: 'form-hint' }, 'استبدال حرفي لمتغيرات {{...}} في القالب من بيانات القضية الفعلية — لا يستدعي أي نموذج ذكاء اصطناعي، ولا توجد استشهادات لتوليدها.'));
    if (error) card.appendChild(h('div', { class: 'form-error' }, error));

    if (templates.length === 0) {
      card.appendChild(h('p', { class: 'empty-note' }, 'لا توجد قوالب مفعّلة بعد — أضف قالباً من صفحة القوالب أولاً.'));
      card.appendChild(h('div', { class: 'page-header', style: 'margin:0' }, h('button', { class: 'btn btn-outline', onclick: () => overlay.remove() }, 'إغلاق')));
      overlay.appendChild(card);
      return;
    }

    const tpl = currentTemplate();
    const rendered = tpl ? renderFilledPreview(tpl.content_text, vars) : '';

    const layout = h('div', { class: 'generator-layout' }, []);

    const controls = h('div', { class: 'generator-controls-pane' }, []);
    controls.appendChild(h('div', { class: 'form-group' }, [
      h('label', { class: 'form-label' }, 'القالب'),
      h('select', {
        class: 'form-select', onchange: (e) => { templateId = e.target.value; paint(); },
      }, templates.map((t) => h('option', { value: t.id, selected: t.id === templateId ? 'true' : null }, `${t.title} (${t.doc_type})`))),
    ]));
    controls.appendChild(h('div', { style: 'font-size:11px; color:var(--text-dim)' },
      'كل حقل أدناه معبّأ من بيانات القضية الفعلية. أي حقل بلا مصدر بيانات (كقيمة المطالبة أو عنوان الخصم) يبقى فارغاً حتى تُدخله يدوياً — لن يُخترع أي رقم أو عنوان.'));
    for (const key of FILL_VAR_KEYS) {
      controls.appendChild(h('div', { class: 'form-group' }, [
        h('label', { class: 'form-label' }, FILL_VAR_LABELS[key]),
        h('input', {
          class: 'form-input', value: vars[key] || '',
          oninput: (e) => { vars[key] = e.target.value; updatePreviewOnly(); },
        }),
      ]));
    }
    layout.appendChild(controls);

    const bodyEl = h('div', { class: 'legal-body-text', id: 'fill-template-body' }, []);
    appendHighlighted(bodyEl, rendered);

    const previewPane = h('div', { class: 'generator-preview-pane' }, [
      h('div', { class: 'generator-preview-toolbar' }, [
        h('span', { class: 'chip chip-confirmed' }, 'معاينة حية — بلا ذكاء اصطناعي'),
        h('div', { style: 'display:flex; gap:8px' }, [
          h('button', { class: 'btn btn-outline btn-sm', onclick: () => window.print() }, 'طباعة'),
          h('button', {
            class: 'btn btn-outline btn-sm',
            onclick: () => { navigator.clipboard?.writeText(document.getElementById('fill-template-body')?.innerText || ''); showToast('تم نسخ النص'); },
          }, 'نسخ النص'),
        ]),
      ]),
      h('div', { class: 'generator-preview-canvas' }, h('div', { class: 'legal-parchment', id: 'print-target' }, [
        h('div', { class: 'legal-header-emblem' }, [
          h('div', { class: 'legal-basmalah' }, 'بسم الله الرحمن الرحيم'),
          h('div', { style: 'font-size:14px; font-weight:700' }, 'جمهورية مصر العربية — وزارة العدل'),
          vars.lawyer_name ? h('div', { class: 'legal-sub-header' }, `مكتب الأستاذ / ${vars.lawyer_name}`) : null,
        ]),
        bodyEl,
      ])),
    ]);
    layout.appendChild(previewPane);
    card.appendChild(layout);

    card.appendChild(h('div', { class: 'page-header', style: 'margin:0' }, [
      h('button', { class: 'btn btn-outline', disabled: loading ? 'true' : null, onclick: () => overlay.remove() }, 'إلغاء'),
      h('button', {
        class: 'btn btn-primary', disabled: loading ? 'true' : null,
        onclick: async () => {
          error = null;
          if (!tpl) return;
          loading = true; status = 'جارٍ الحفظ…'; paint();
          try {
            await callFunction('litigation-fill-template', { matter_id: matterId, template_id: tpl.id, overrides: vars });
            overlay.remove(); onDone();
          } catch (e) { error = e.message; loading = false; status = null; paint(); }
        },
      }, status || 'حفظ كمسودة في ملف القضية'),
    ]));

    overlay.appendChild(card);
  }
  paint();
}

// ---------- case analysis ----------
// Manual, on-demand — mirrors renderChronologyPanel's pattern (a "run"
// button, not auto-triggered). Still nothing persisted server-side
// (litigation-analyze-case itself remains stateless, by design — a
// stored analysis would silently go stale as documents/corpus change),
// but the last result IS now kept in this in-memory, per-tab cache
// (caseAnalysisCache) so switching tabs/screens within the same page
// load no longer throws it away and forces a re-run. It still resets on
// a full page reload or logout — that's deliberate, not a bug: nothing
// about case analysis is meant to survive as a record of truth, only as
// a convenience within one browsing session. The generation timestamp is
// shown alongside the result specifically so staleness stays visible
// instead of hidden — a two-day-old analysis reads as exactly that, not
// as if it just ran.
const caseAnalysisCache = new Map(); // matterId -> { result, generatedAt: Date }

function renderCaseAnalysisPanel(matterId, matter) {
  const cached = caseAnalysisCache.get(matterId);
  let result = cached ? cached.result : null;
  let generatedAt = cached ? cached.generatedAt : null;
  let error = null, loading = false;
  const hasSubject = !!(matter.subject && matter.subject.trim());
  const panel = h('div', { class: 'dash-panel' }, []);

  function paint() {
    clear(panel);
    panel.appendChild(h('div', { class: 'panel-head' }, [
      h('div', { class: 'panel-title' }, [icon('research'), 'تحليل القضية بالذكاء الاصطناعي']),
      h('button', {
        class: 'btn btn-outline btn-sm',
        disabled: (loading || !hasSubject) ? 'true' : null,
        onclick: generate,
      }, loading ? 'جارٍ التحليل…' : 'تحليل'),
    ]));
    panel.appendChild(h('p', { class: 'form-hint' },
      'يُبنى عند الطلب من مستندات هذه القضية المستخرجة (كمصدر وحيد للوقائع) ومن المصادر القانونية المطابقة للموضوع (كمصدر وحيد للاستشهاد) — لا يُحفظ، وإن لم يوجد أي منهما لا يُطلب من النموذج شيء.'));
    if (!hasSubject) {
      panel.appendChild(h('div', { class: 'form-error', style: 'background:rgba(217,114,10,.08); color:var(--warn); border-color:rgba(217,114,10,.3)' },
        'أدخل الموضوع أولاً (أعلاه) لتفعيل التحليل.'));
    }
    if (error) panel.appendChild(h('div', { class: 'form-error' }, error));
    if (result) {
      if (result.note) panel.appendChild(h('div', { class: 'form-error', style: 'background:rgba(217,114,10,.08); color:var(--warn); border-color:rgba(217,114,10,.3)' }, result.note));
      if (result.error) panel.appendChild(h('div', { class: 'form-error' }, result.error));
      if (result.warnings && result.warnings.length > 0) {
        panel.appendChild(h('div', { class: 'form-error', style: 'background:rgba(217,114,10,.08); color:var(--warn); border-color:rgba(217,114,10,.3)' },
          result.warnings.map((w) => h('div', {}, `⚠ ${w}`))));
      }
      if (result.analysis) {
        panel.appendChild(h('div', { class: 'ai-summary-box' }, [
          generatedAt ? h('div', { class: 'form-hint', style: 'margin-bottom:8px' }, ['تم التحليل في: ', bdi(fmtDateTime(generatedAt))]) : null,
          h('div', { class: 'ai-summary-content' }, result.analysis),
          h('div', { class: 'form-hint', style: 'margin-top:10px' }, [
            'مبني على ', bdi(result.case_context.pages_used), ' صفحة من ', bdi(result.case_context.documents_used),
            ' مستند لهذه القضية، و', bdi((result.matches || []).length), ' مقطع قانوني.',
          ]),
          (result.matches || []).length > 0
            ? h('div', { class: 'form-hint' }, `المصادر: ${result.matches.map((mt) => `${mt.title} (${mt.citation})`).join('، ')}`)
            : null,
          h('div', { style: 'margin-top:10px; padding-top:10px; border-top:1px solid var(--border)' },
            (result.web_sources || []).length > 0
              ? [
                  h('div', { class: 'form-hint', style: 'font-weight:600' }, 'مصادر خارجية استُخدمت لقسم خطة العمل فقط (غير موثّقة من المكتب — تحقق بنفسك):'),
                  h('ul', { style: 'margin:6px 0 0; padding-inline-start:20px' },
                    result.web_sources.map((s) => h('li', { class: 'form-hint' }, [
                      h('a', { href: s.uri, target: '_blank', rel: 'noopener noreferrer' }, s.title || s.uri),
                    ]))),
                  (result.web_search_queries || []).length > 0
                    ? h('div', { class: 'form-hint', style: 'margin-top:6px' }, `عبارات البحث: ${result.web_search_queries.join('، ')}`)
                    : null,
                ]
              : h('div', { class: 'form-hint' }, 'لم يُستخدم بحث خارجي عبر الإنترنت في هذا التحليل — لم يُستدعِ النموذج أداة البحث لهذا الطلب.')),
        ]));
      }
    }
  }

  async function generate() {
    error = null; loading = true; paint();
    try {
      result = await callFunction('litigation-analyze-case', { matter_id: matterId });
      generatedAt = new Date();
      caseAnalysisCache.set(matterId, { result, generatedAt });
      loading = false; paint();
    } catch (e) { error = e.message; loading = false; paint(); }
  }
  paint();
  return panel;
}

// ---------- chronology ----------
function renderChronologyPanel(matterId) {
  let events = null, error = null, loading = false, truncated = false;
  const panel = h('div', { class: 'dash-panel' }, []);

  function paint() {
    clear(panel);
    panel.appendChild(h('div', { class: 'panel-head' }, [
      h('div', { class: 'panel-title' }, 'التسلسل الزمني'),
      h('button', { class: 'btn btn-outline btn-sm', disabled: loading ? 'true' : null, onclick: generate }, loading ? 'جارٍ التوليد…' : 'توليد'),
    ]));
    panel.appendChild(h('p', { class: 'form-hint' }, 'يُبنى عند الطلب من نصوص المستندات المستخرجة بالفعل (Gemini) — لا يُحفظ، وكل حدث يشير إلى المستند والصفحة المصدر.'));
    if (error) panel.appendChild(h('div', { class: 'form-error' }, error));
    if (truncated) panel.appendChild(h('div', { class: 'form-error', style: 'background:rgba(217,114,10,.08); color:var(--warn); border-color:rgba(217,114,10,.3)' }, 'تم اقتطاع بعض النص لتجاوز الحد الأقصى — النتيجة قد تكون غير كاملة.'));
    if (events) {
      panel.appendChild(events.length
        ? h('div', { class: 'chronology-tree' }, events.map((ev) => h('div', { class: 'chron-entry' }, [
            h('div', { class: 'chron-date' }, bdi(ev.date || '—')),
            h('div', { class: 'chron-desc' }, [
              ev.description,
              h('div', {}, h('span', { class: 'chron-ref-chip' }, `ص. ${ev.source_page_number}`)),
            ]),
          ])))
        : h('p', { class: 'empty-note' }, 'لا توجد أحداث مستخرجة.'));
    }
  }

  async function generate() {
    error = null; loading = true; paint();
    try {
      const res = await callFunction('litigation-chronology', { matter_id: matterId });
      events = res.events; truncated = !!res.truncated; loading = false; paint();
    } catch (e) { error = e.message; loading = false; paint(); }
  }
  paint();
  return panel;
}

// ---------- party dialog ----------

    party_role: party?.party_role || 'plaintiff',

  function paint() {
    clear(overlay);

      ]),
      h('div', { class: 'form-group' }, [h('label', { class: 'form-label' }, 'الاسم *'),

      h('div', { class: 'form-group' }, [h('label', { class: 'form-label' }, 'الرقم التعريفي'),
        h('input', { class: 'form-input', value: form.identifier, oninput: (e) => (form.identifier = e.target.value) })]),
      h('div', { class: 'form-group' }, [h('label', { class: 'form-label' }, 'ملاحظات'),

// ---------- hearing dialog ----------
function openHearingDialog(matterId, onDone) {

// ---------- document upload ----------
const FILE_STAGE_LABEL = { null: 'قيد الانتظار', uploading: 'رفع', extracting: 'استخراج (Gemini)', done: 'تم', failed: 'فشل' };

// Multiple files at once, processed sequentially (not in parallel — keeps
// legal-ingest/legal-extract load predictable and error handling simple).
// One file failing does not stop the batch; each row tracks its own
// stage/error independently, and onDone() runs once at the end so the
// Documents tab refreshes showing whatever did succeed.
function openUploadDialog(matterId, onDone) {
  const overlay = h('div', { class: 'modal-overlay', onclick: (e) => { if (e.target === overlay && !busy) overlay.remove(); } }, []);
  document.body.appendChild(overlay);
  let rows = []; // { file, stage: null|'uploading'|'extracting'|'done'|'failed', errorMsg }
  let error = null, busy = false, started = false;

  function paint() {
    clear(overlay);
    overlay.appendChild(h('div', { class: 'modal-card' }, [
      h('h2', {}, 'رفع مستندات'),
      error ? h('div', { class: 'form-error' }, error) : null,
      !started ? h('div', { class: 'form-group' }, [
        h('label', { class: 'form-label' }, 'الملفات (PDF أو صور) — يمكن اختيار عدة ملفات دفعة واحدة'),
        h('input', {
          class: 'form-input', type: 'file', multiple: 'true', accept: 'application/pdf,image/*',
          onchange: (e) => { rows = Array.from(e.target.files || []).map((f) => ({ file: f, stage: null, errorMsg: null })); paint(); },
        }),
      ]) : null,
      rows.length > 0 ? h('div', { style: 'display:flex; flex-direction:column; gap:8px; margin-block:10px' }, rows.map((r, i) => h('div', {
        style: 'display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 10px; background:var(--inset); border-radius:var(--radius-sm)',
      }, [
        h('div', { style: 'display:flex; flex-direction:column; gap:2px; min-width:0' }, [
          h('span', { style: 'font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap' }, r.file.name),
          r.errorMsg ? h('span', { class: 'form-hint', style: 'color:var(--danger)' }, r.errorMsg) : null,
        ]),
        !started ? h('button', { class: 'btn btn-outline btn-sm', onclick: () => { rows = rows.filter((_, j) => j !== i); paint(); } }, '×')
          : h('span', { class: `chip ${r.stage === 'done' ? 'chip-confirmed' : r.stage === 'failed' ? 'chip-danger' : 'chip-provisional'}` }, FILE_STAGE_LABEL[r.stage]),
      ]))) : null,
      h('div', { class: 'page-header', style: 'margin:0' }, [
        h('button', { class: 'btn btn-outline', disabled: busy ? 'true' : null, onclick: () => overlay.remove() }, started ? 'إغلاق' : 'إلغاء'),
        !started ? h('button', {
          class: 'btn btn-primary',
          onclick: async () => {
            error = null;
            if (rows.length === 0) { error = 'اختر ملفاً واحداً على الأقل'; paint(); return; }
            started = true; busy = true; paint();
            for (const r of rows) {
              r.stage = 'uploading'; paint();
              try {
                const ing = await callFunction('legal-ingest', { matter_id: matterId, original_filename: r.file.name, mime_type: r.file.type });
                const { error: upErr } = await sb.storage.from('matter-documents').uploadToSignedUrl(ing.storage_path, ing.token, r.file);
                if (upErr) throw upErr;
                r.stage = 'extracting'; paint();
                await callFunction('legal-extract', { document_id: ing.document_id, job_id: ing.job_id });
                r.stage = 'done'; paint();
              } catch (e) { r.stage = 'failed'; r.errorMsg = e.message; paint(); }
            }
            busy = false; paint();
            onDone();
          },
        }, 'رفع') : null,
      ]),
    ]));
  }
  paint();
}

// ---------- review queue (split view) ----------
async function renderReviewQueue(content) {
  clear(content);
  content.appendChild(h('div', { class: 'page-header' }, [
    h('div', {}, [h('h1', { class: 'page-title' }, 'مراجعة الاستخراج'), h('div', { class: 'page-subtitle' }, 'كل حقل هنا كانت ثقة النموذج فيه أقل من 85% — لم يُطبَّق تلقائياً على القضية')]),
  ]));

  const container = h('div', {}, h('p', { class: 'empty-note' }, 'جارٍ التحميل…'));
  content.appendChild(container);

  const { data, error } = await sb
    .from('extractions')
    .select('id, matter_id, document_id, field_key, field_value, confidence, created_at, matters(matter_label)')
    .eq('review_status', 'pending')
    .order('document_id', { ascending: true })
    .order('created_at', { ascending: true });

  clear(container);
  if (error) { container.appendChild(h('div', { class: 'form-error' }, ['تعذّر التحميل: ', error.message])); return; }
  if (!data || data.length === 0) { container.appendChild(h('p', { class: 'empty-note' }, 'لا يوجد شيء بانتظار المراجعة.')); return; }

  const byDoc = new Map();
  for (const ex of data) { if (!byDoc.has(ex.document_id)) byDoc.set(ex.document_id, []); byDoc.get(ex.document_id).push(ex); }
  const docIds = [...byDoc.keys()];
  let activeDocId = docIds[0];

  const split = h('div', { class: 'split-review-container' }, []);
  container.appendChild(split);

  async function paintSplit() {
    clear(split);
    const docExts = byDoc.get(activeDocId) || [];
    const { data: docRow } = await sb.from('documents').select('id, original_filename, matter_id, storage_path, mime_type').eq('id', activeDocId).maybeSingle();

    // Left: doc viewer pane
    const viewerPane = h('div', { class: 'doc-viewer-pane' }, [
      h('div', { class: 'doc-viewer-header' }, [
        h('span', {}, docRow?.original_filename || 'مستند'),
        docIds.length > 1 ? h('select', {
          class: 'form-select', style: 'width:auto; padding-block:4px',
          onchange: (e) => { activeDocId = e.target.value; paintSplit(); },
        }, docIds.map((id) => h('option', { value: id, selected: id === activeDocId ? 'true' : null }, (byDoc.get(id)[0].matters?.matter_label || id) + ` (${byDoc.get(id).length})`))) : null,
      ]),
      h('div', { class: 'doc-canvas-area' }, h('p', { style: 'color:#aaa; font-size:13px' }, 'جارٍ تحميل المعاينة…')),
    ]);
    split.appendChild(viewerPane);

    if (docRow) {
      const canvas = viewerPane.querySelector('.doc-canvas-area');
      clear(canvas);
      try {
        const signRes = await callFunction('sign-document-url', { matter_id: docRow.matter_id, bucket: 'matter-documents', storage_path: docRow.storage_path });
        if (String(docRow.mime_type || '').startsWith('image/')) canvas.appendChild(h('img', { src: signRes.url }));
        else canvas.appendChild(h('iframe', { src: signRes.url }));
      } catch (e) {
        canvas.appendChild(h('p', { style: 'color:#ddd; font-size:13px; padding:16px' }, 'تعذّر تحميل معاينة الملف.'));
      }
    }

    // Right: extractions pane
    const extPane = h('div', { class: 'extractions-pane' }, [
      h('div', { class: 'extractions-header' }, [
        h('strong', {}, 'الحقول المستخرجة'),
        h('span', { class: 'chip chip-stage' }, [bdi(docExts.length), ' حقول']),
      ]),
    ]);
    const list = h('div', { class: 'extractions-list' }, []);
    for (const ex of docExts) list.appendChild(renderReviewRow(ex, () => renderReviewQueue(content)));
    extPane.appendChild(list);
    split.appendChild(extPane);
  }
  await paintSplit();
}

function renderReviewRow(ex, onDone) {
  let corrected = ex.field_value || '', error = null, submitting = false;
  const row = h('div', { class: 'extraction-row' }, []);
  const confPct = Math.round((ex.confidence || 0) * 100);
  const confClass = confPct >= 85 ? 'confidence-high' : confPct >= 60 ? 'confidence-mid' : 'confidence-low';

  function paint() {
    clear(row);
    row.appendChild(h('div', { class: 'ext-top' }, [
      h('span', { class: 'ext-field-name' }, ex.field_key),
      h('span', { class: `confidence-chip ${confClass}` }, ['ثقة: ', bdi(confPct + '%')]),
    ]));
    row.appendChild(h('p', { class: 'form-hint' }, ex.matters ? ex.matters.matter_label : ex.matter_id));
    if (error) row.appendChild(h('div', { class: 'form-error' }, error));
    row.appendChild(h('input', { class: 'ext-value-input', value: corrected, oninput: (e) => (corrected = e.target.value) }));
    row.appendChild(h('div', { class: 'ext-actions-bar' }, [
      h('button', { class: 'btn btn-good btn-sm', disabled: submitting ? 'true' : null, onclick: () => act(corrected === ex.field_value ? 'confirm' : 'correct') }, corrected === ex.field_value ? '✓ قبول' : '✏️ تصحيح'),
      h('button', { class: 'btn btn-danger btn-sm', disabled: submitting ? 'true' : null, onclick: () => act('reject') }, '✕ رفض'),
    ]));
  }

  async function act(action) {
    error = null; submitting = true; paint();
    try {
      await callFunction('litigation-review-extraction', { extraction_id: ex.id, action, corrected_value: action === 'correct' ? corrected : undefined });
      onDone();
    } catch (e) { error = e.message; submitting = false; paint(); }
  }
  paint();
  return row;
}

async function renderSearchPage(content) {

async function runEmbedBatch(buttonEl, onDone) {
  buttonEl.disabled = true;
  const original = buttonEl.textContent;
  try {
    // Bounded per call (see admin-embed-authorities) — loop client-side
    // until nothing is left, capped so a stuck backend can't spin forever.
    for (let i = 0; i < 20; i++) {
      buttonEl.textContent = `جارٍ الفهرسة… (${i + 1})`;
      const res = await callFunction('admin-embed-authorities', { limit: 200 });
      if (!res.remaining || res.remaining === 0) break;
    }
    showToast('اكتملت الفهرسة الدلالية.');
  } catch (e) {
    showToast(`تعذّرت الفهرسة: ${e.message}`);
  } finally {
    buttonEl.disabled = false;
    buttonEl.textContent = original;
    onDone();
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = String(reader.result || '');
      const idx = result.indexOf(',');
      resolve(idx >= 0 ? result.slice(idx + 1) : result);
    };
    reader.onerror = () => reject(reader.error || new Error('تعذّرت قراءة الملف'));
    reader.readAsDataURL(file);
  });
}

      if (result.answer) {

          h('div', { class: 'ai-summary-content' }, result.answer),
          h('div', { class: 'form-hint', style: 'margin-top:10px' }, `المصادر: ${(result.matches || []).map((m) => `${m.title} (${m.citation})`).join('، ')}`),
        ]));
      }
    }
  }

  async function search() {
    if (!query.trim()) return;
    error = null; loading = true; paint();
    try {
      result = await callFunction('litigation-research', { query });
      loading = false; paint();
    } catch (e) { error = e.message; loading = false; paint(); }
  }
  paint();
}

  const overlay = h('div', { class: 'modal-overlay', onclick: (e) => { if (e.target === overlay) overlay.remove(); } }, []);
  document.body.appendChild(overlay);
  overlay.appendChild(h('div', { class: 'modal-card' }, [
    h('h2', {}, 'كلمة مرور مؤقتة'),
    h('p', { class: 'form-hint' }, ['لن تُعرض هذه الكلمة مرة أخرى — انسخها الآن وأرسلها إلى ', h('bdi', {}, email), ' عبر قناة منفصلة. سيُطلب من المستخدم تعيين كلمة مرور جديدة فور دخوله.']),
    h('div', { class: 'form-group' }, [
      h('label', { class: 'form-label' }, 'كلمة المرور المؤقتة'),
      h('input', { class: 'form-input mono-data', style: 'font-family:var(--font-mono)', value: tempPassword, readonly: 'true', onclick: (e) => e.target.select() }),
    ]),
    h('div', { class: 'page-header', style: 'margin:0' }, [
      h('button', { class: 'btn btn-outline', onclick: () => overlay.remove() }, 'إغلاق'),
      h('button', {
        class: 'btn btn-primary',
        onclick: async () => {
          try { await navigator.clipboard.writeText(tempPassword); showToast('تم نسخ كلمة المرور'); }
          catch { showToast('تعذّر النسخ — انسخها يدوياً'); }
        },
      }, 'نسخ'),

  ]));
}

async function renderAdminUsersPage(content) {
  clear(content);
  const canManage = viewer?.capabilities.has('manage_users') ?? false;
  content.appendChild(h('div', { class: 'page-header' }, h('div', {}, [h('h1', { class: 'page-title' }, 'المستخدمون والأدوار'), h('div', { class: 'page-subtitle' }, 'كل صاحب ملف تعريف، دوره النشط، وحالته')])));

  const wrap = h('div', {}, h('p', { class: 'empty-note' }, 'جارٍ التحميل…'));
  content.appendChild(wrap);

  const [{ data: profiles, error }, { data: userRoles }, { data: roles }] = await Promise.all([
    sb.from('profiles').select('id, full_name, bar_number, status, supervisor_id').order('full_name'),
    sb.from('user_roles').select('user_id, role_id').is('revoked_at', null),
    sb.from('roles').select('id, label_en').order('sort_order'),
  ]);

  clear(wrap);
  if (error) { wrap.appendChild(h('div', { class: 'form-error' }, ['تعذّر التحميل: ', error.message])); return; }

  const roleLabel = new Map((roles || []).map((r) => [r.id, r.label_en]));
  const rolesByUser = new Map();
  for (const row of userRoles || []) {
    const list = rolesByUser.get(row.user_id) || [];
    list.push(roleLabel.get(row.role_id) || row.role_id);
    rolesByUser.set(row.user_id, list);
  }

  wrap.appendChild(h('div', { class: 'table-card' }, h('div', { class: 'table-wrapper' }, h('table', { class: 'dense-table' }, [
    h('thead', {}, h('tr', {}, ['الاسم', 'رقم القيد', 'الحالة', 'الدور', 'المشرف', 'المعرّف'].map((t) => h('th', {}, t)))),
    h('tbody', {}, (profiles || []).map((p) => h('tr', {}, [
      h('td', {}, p.full_name), h('td', {}, bdi(p.bar_number || '—')),
      h('td', {}, h('span', { class: `chip ${p.status === 'active' ? 'chip-confirmed' : 'chip-stage'}` }, p.status)),
      h('td', {}, (rolesByUser.get(p.id) || []).join('، ') || h('span', { class: 'form-hint' }, 'بدون دور')),
      h('td', {}, bdi(p.supervisor_id || '—')),
      h('td', { style: 'font-family:var(--font-mono); font-size:11px' }, bdi(p.id)),
    ]))),
  ]))));

  if (!canManage) return;

  const actionsGrid = h('div', { style: 'display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-block-start:14px' });
  content.appendChild(actionsGrid);

  actionsGrid.appendChild(h('div', { class: 'dash-panel' }, [
    h('h3', {}, 'دعوة مستخدم'),
    buildForm({
      fields: [
        { key: 'email', label: 'البريد الإلكتروني *', type: 'email' },
        { key: 'role_id', label: 'الدور', type: 'select', options: [['', '—'], ...(roles || []).map((r) => [r.id, r.label_en])] },
        { key: 'full_name', label: 'الاسم الكامل', type: 'text' },
        { key: 'supervisor_id', label: 'المشرف (UUID) — للمحامي المتدرب فقط', type: 'text' },
      ],
      submitLabel: 'دعوة',
      onSubmit: async (form) => {
        if (!form.email.trim() || !form.role_id) throw new Error('البريد الإلكتروني والدور مطلوبان');
        const res = await callFunction('admin-invite-user', { email: form.email, role_id: form.role_id, full_name: form.full_name || undefined, supervisor_id: form.supervisor_id || undefined });
        showToast(`تمت الدعوة — user_id=${res.user_id}`);
        renderAdminUsersPage(content);
      },
    }),
  ]));

  actionsGrid.appendChild(h('div', { class: 'dash-panel' }, [
    h('h3', {}, 'تعديل الدور'),
    buildForm({
      fields: [
        { key: 'user_id', label: 'معرّف المستخدم *', type: 'text' },
        { key: 'role_id', label: 'الدور', type: 'select', options: (roles || []).map((r) => [r.id, r.label_en]) },
        { key: 'action', label: 'الإجراء', type: 'select', options: [['grant', 'منح'], ['revoke', 'سحب']] },
      ],
      defaults: { action: 'grant' },
      submitLabel: 'تنفيذ',
      onSubmit: async (form) => {
        if (!form.user_id.trim() || !form.role_id) throw new Error('معرّف المستخدم والدور مطلوبان');
        const res = await callFunction('admin-set-role', { user_id: form.user_id, role_id: form.role_id, action: form.action });
        showToast(`${res.action === 'grant' ? 'تم المنح' : 'تم السحب'}: ${res.role_id}`);
        renderAdminUsersPage(content);
      },
    }),
  ]));

  actionsGrid.appendChild(h('div', { class: 'dash-panel' }, [
    h('h3', {}, 'إنهاء الجلسات'),
    buildForm({
      fields: [
        { key: 'user_id', label: 'معرّف المستخدم *', type: 'text' },
        { key: 'reason', label: 'السبب *', type: 'textarea' },
      ],
      submitLabel: 'تسجيل خروج إجباري',
      danger: true,
      onSubmit: async (form) => {
        if (!form.user_id.trim() || !form.reason.trim()) throw new Error('كل الحقول مطلوبة');
        const res = await callFunction('admin-revoke-sessions', { user_id: form.user_id, reason: form.reason });
        showToast(`تم حذف ${res.sessions_deleted} جلسة`);
      },
    }),
  ]));

  actionsGrid.appendChild(h('div', { class: 'dash-panel' }, [
    h('h3', {}, 'إنهاء خدمة مستخدم'),
    h('p', { class: 'form-hint' }, 'يعيد توزيع كل صلاحيات القضايا المفتوحة قبل سحب الأدوار وتعطيل الحساب.'),
    buildForm({
      fields: [{ key: 'user_id', label: 'معرّف المستخدم *', type: 'text' }],
      submitLabel: 'إنهاء الخدمة',
      danger: true,
      onSubmit: async (form) => {
        if (!form.user_id.trim()) throw new Error('معرّف المستخدم مطلوب');
        await callFunction('admin-offboard-user', { user_id: form.user_id, reassignments: [] });
        showToast('تم إنهاء الخدمة — راجع صلاحيات القضايا المفتوحة يدوياً إن وُجدت');
        renderAdminUsersPage(content);
      },
    }),
  ]));

  // Deliberately gated on the owner role specifically, not just
  // manage_users (which admin also holds) — matches
  // admin-set-temp-password's own server-side check, which is the real
  // enforcement; this is only what decides whether the panel is shown.
  if (viewer?.roleIds?.includes('owner')) {
    actionsGrid.appendChild(h('div', { class: 'dash-panel' }, [
      h('h3', {}, 'تعيين كلمة مرور مؤقتة'),
      h('p', { class: 'form-hint' }, 'يفرض على المستخدم تعيين كلمة مرور جديدة فور دخوله التالي، قبل أي شيء آخر — مقتصر على مالك المكتب.'),
      buildForm({
        fields: [
          { key: 'user_id', label: 'معرّف المستخدم *', type: 'text' },
          { key: 'reason', label: 'السبب (اختياري)', type: 'text' },
        ],
        submitLabel: 'تعيين كلمة مرور مؤقتة',
        danger: true,
        onSubmit: async (form) => {
          if (!form.user_id.trim()) throw new Error('معرّف المستخدم مطلوب');
          const res = await callFunction('admin-set-temp-password', { user_id: form.user_id, reason: form.reason || undefined });
          openTempPasswordResultDialog(res.email, res.temp_password);
        },
      }),
    ]));
  }
}

      class: 'btn btn-outline btn-sm', disabled: loading ? 'true' : null,
      onclick: async () => {
        error = null; done = false;
        if (!matterId.trim()) { error = 'معرّف القضية مطلوب'; paint(); return; }
        loading = true; paint();
        try { preview = await callFunction('admin-execute-purge', { action: 'preview', matter_id: matterId }); }
        catch (e) { error = e.message; preview = null; }
        loading = false; paint();
      },
    }, loading ? 'جارٍ المعاينة…' : 'معاينة'));

    if (preview) {
      const box = h('div', { style: 'margin-top:14px; border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px' }, [
        h('div', {}, [
          h('strong', {}, preview.matter_label), h('span', { class: 'form-hint', style: 'margin-inline-start:8px' }, preview.status),
          preview.under_legal_hold
            ? h('span', { class: 'chip chip-danger', style: 'margin-inline-start:8px' }, 'تحت تجميد قانوني — لا يمكن الإتلاف')
            : h('span', { class: 'chip chip-confirmed', style: 'margin-inline-start:8px' }, 'قابل للإتلاف'),
        ]),
        h('p', { class: 'form-hint', style: 'margin-top:6px' }, preview.scope),
      ]);
      panel.appendChild(box);

      if (preview.purgeable) {
        box.appendChild(h('div', { style: 'margin-top:12px; border-top:1px solid var(--border); padding-top:12px' }, [
          h('div', { class: 'form-group' }, [h('label', { class: 'form-label' }, 'السبب *'), h('textarea', { class: 'form-textarea', rows: '2', oninput: (e) => (reason = e.target.value) })]),
          h('div', { class: 'form-group' }, [
            h('label', { class: 'form-label' }, 'معرّف طلب صاحب البيانات (اتركه فارغاً لإتلاف احتفاظ روتيني — يجب أن تكون القضية مغلقة/مؤرشفة؛ املأه لتنفيذ محو معتمد)'),
            h('input', { class: 'form-input', oninput: (e) => (dataRequestId = e.target.value) }),
          ]),
          h('button', {
            class: 'btn btn-danger', disabled: loading ? 'true' : null,
            onclick: async () => {
              error = null;
              if (!reason.trim()) { error = 'السبب مطلوب'; paint(); return; }
              loading = true; paint();
              try {
                await callFunction('admin-execute-purge', { action: 'purge', matter_id: preview.matter_id, reason, data_request_id: dataRequestId || undefined });
                done = true; preview = null; matterId = ''; reason = ''; dataRequestId = '';
              } catch (e) { error = e.message; }
              loading = false; paint();
            },
          }, loading ? 'جارٍ الإتلاف…' : 'إتلاف'),
        ]));
      }
    }
  }
  paint();
}

async function renderAdminCostPage(content) {
  clear(content);
  content.appendChild(h('div', { class: 'page-header' }, h('div', {}, [h('h1', { class: 'page-title' }, 'التكلفة والاستخدام'), h('div', { class: 'page-subtitle' }, 'عرض فقط — لا يوجد وكيل فعلي في هذه البيئة يُنتج بيانات استخدام بعد')])));

  const wrap = h('div', {}, h('p', { class: 'empty-note' }, 'جارٍ التحميل…'));
  content.appendChild(wrap);
  const [{ data: limits, error }, { data: usage }] = await Promise.all([
    sb.from('spend_limits').select('*'),
    sb.from('usage_ledger').select('*').limit(50),
  ]);
  clear(wrap);
  if (error) { wrap.appendChild(h('div', { class: 'form-error' }, ['تعذّر التحميل: ', error.message])); return; }

  wrap.appendChild(h('h3', {}, 'حدود الإنفاق'));
  if (!limits || limits.length === 0) wrap.appendChild(h('p', { class: 'empty-note' }, 'لا توجد حدود إنفاق بعد.'));
  else {
    wrap.appendChild(h('div', { class: 'table-card', style: 'margin-top:8px' }, h('div', { class: 'table-wrapper' }, h('table', { class: 'dense-table' }, [
      h('thead', {}, h('tr', {}, ['النطاق', 'نوع القضية', 'الفترة', 'الحد الناعم', 'الحد الصارم', 'الحالة'].map((t) => h('th', {}, t)))),
      h('tbody', {}, limits.map((l) => h('tr', {}, [
        h('td', { style: 'font-family:var(--font-mono)' }, l.scope), h('td', {}, l.matter_type || '—'), h('td', {}, l.period),
        h('td', {}, l.soft_limit_usd != null ? `$${l.soft_limit_usd}` : '—'), h('td', {}, `$${l.hard_limit_usd}`),
        h('td', {}, h('span', { class: `chip ${l.active ? 'chip-confirmed' : 'chip-stage'}` }, l.active ? 'نشط' : 'غير نشط')),
      ]))),
    ]))));
  }

  wrap.appendChild(h('h3', { style: 'margin-top:20px' }, 'سجل الاستخدام (آخر 50)'));
  if (!usage || usage.length === 0) wrap.appendChild(h('p', { class: 'empty-note' }, 'لا يوجد استخدام مُسجَّل بعد — لا يوجد وكيل فعلي في هذه البيئة يُنتجه.'));
  else wrap.appendChild(h('pre', { style: 'margin-top:8px; max-height:320px; overflow:auto; background:var(--inset); padding:10px; border-radius:var(--radius-sm); font-size:12px' }, JSON.stringify(usage, null, 2)));
}

function renderMfaEnroll() {
  clear(app);
  let factorId = null, qrCode = null, secret = null, code = '', error = null, loading = false, enrolling = true;

  function paint() {
    clear(app);
    const box = h('div', { class: 'auth-card' }, [
      h('div', { class: 'auth-brand' }, [h('div', { class: 'firm-logo' }, [h('img', { src: AVATAR_SRC, alt: 'هويام' })]), h('div', { class: 'firm-title' }, 'تسجيل التحقق بخطوتين')]),
      h('p', { class: 'form-hint' }, 'التحقق بخطوتين إلزامي لكل حساب. امسح هذا الرمز بتطبيق مصادقة (Authy، 1Password، Google Authenticator...) قبل المتابعة.'),
      error ? h('div', { class: 'form-error' }, error) : null,
      enrolling ? h('p', { class: 'form-hint' }, 'جارٍ التجهيز…') : null,
      qrCode ? h('img', { src: qrCode, alt: 'رمز QR', style: 'display:block; margin:0 auto; width:160px; height:160px; border:1px solid var(--border); border-radius:var(--radius-sm); background:#fff; padding:8px' }) : null,
      secret ? h('p', { class: 'form-hint', style: 'text-align:center; font-family:var(--font-mono)' }, [h('bdi', {}, secret)]) : null,
      !enrolling ? h('div', { class: 'form-group' }, [
        h('label', { class: 'form-label' }, 'الرمز من التطبيق'),
        h('input', { class: 'form-input mono-data', style: 'font-family:var(--font-mono)', inputmode: 'numeric', maxlength: '6', value: code, oninput: (e) => (code = e.target.value) }),
      ]) : null,
      !enrolling ? h('button', {
        class: 'btn btn-primary', disabled: loading ? 'true' : null,
        onclick: async () => {
          if (!factorId) return;
          error = null; loading = true; paint();
          try {
            const { data: challenge, error: challengeError } = await sb.auth.mfa.challenge({ factorId });
            if (challengeError) throw challengeError;
            const { error: verifyError } = await sb.auth.mfa.verify({ factorId, challengeId: challenge.id, code });
            if (verifyError) throw verifyError;
            boot();
          } catch (e) { error = e.message; loading = false; paint(); }
        },
      }, loading ? 'جارٍ التأكيد…' : 'تأكيد والمتابعة') : null,
    ]);
    app.appendChild(h('div', { class: 'auth-screen' }, box));
  }
  paint();

  // A user who reaches this screen, scans nothing, and reloads/retries
  // leaves a stale unverified TOTP factor behind — enroll() then fails
  // with "factor already exists" and they'd be stuck. Clear any leftover
  // unverified factor first so this screen always works on retry.
  (async () => {
    const { data: factors } = await sb.auth.mfa.listFactors();
    const stale = (factors?.totp || []).find((f) => f.status !== 'verified');
    if (stale) await sb.auth.mfa.unenroll({ factorId: stale.id });

    const { data, error: enrollError } = await sb.auth.mfa.enroll({ factorType: 'totp' });
    enrolling = false;
    if (enrollError) { error = enrollError.message; paint(); return; }
    factorId = data.id; qrCode = data.totp.qr_code; secret = data.totp.secret;
    paint();
  })();
}

// ---------- router ----------
function route() {
  const content = document.getElementById('content');
  if (!content) return;
  const hash = location.hash || '#/dashboard';
  const matterMatch = hash.match(/^#\/matters\/([0-9a-f-]+)/i);
  if (hash.startsWith('#/dashboard')) renderDashboardScreen(content);
  else if (hash.startsWith('#/roll')) renderHearingRollScreen(content);
  else if (hash.startsWith('#/deadlines')) renderDeadlinesScreen(content);
  else if (hash.startsWith('#/review')) renderReviewQueue(content);
  else if (hash.startsWith('#/search')) renderSearchPage(content);
  else if (hash.startsWith('#/templates')) renderTemplatesPage(content);
  else if (hash.startsWith('#/corpus')) renderCorpusPage(content);
  else if (hash.startsWith('#/research')) renderResearchPage(content);
  else if (hash.startsWith('#/admin/users')) renderAdminUsersPage(content);
  else if (hash.startsWith('#/admin/matter-access')) renderAdminMatterAccessPage(content);
  else if (hash.startsWith('#/admin/ethical-walls')) renderAdminEthicalWallsPage(content);
  else if (hash.startsWith('#/admin/break-glass')) renderAdminBreakGlassPage(content);
  else if (hash.startsWith('#/admin/deadline-rules')) renderAdminDeadlineRulesPage(content);
  else if (hash.startsWith('#/admin/court-calendar')) renderAdminCourtCalendarPage(content);
  else if (hash.startsWith('#/admin/agent-configs')) renderAdminAgentConfigsPage(content);
  else if (hash.startsWith('#/admin/prompts')) renderAdminPromptsPage(content);
  else if (hash.startsWith('#/admin/feature-flags')) renderAdminFeatureFlagsPage(content);
  else if (hash.startsWith('#/admin/guardrails')) renderAdminGuardrailsPage(content);
  else if (hash.startsWith('#/admin/kill-switch')) renderAdminKillSwitchPage(content);
  else if (hash.startsWith('#/admin/evals')) renderAdminEvalsPage(content);
  else if (hash.startsWith('#/admin/audit-log')) renderAdminAuditLogPage(content);
  else if (hash.startsWith('#/admin/legal-holds')) renderAdminLegalHoldsPage(content);
  else if (hash.startsWith('#/admin/retention')) renderAdminRetentionPage(content);
  else if (hash.startsWith('#/admin/disclosures')) renderAdminDisclosuresPage(content);
  else if (hash.startsWith('#/admin/data-requests')) renderAdminDataRequestsPage(content);
  else if (hash.startsWith('#/admin/purge')) renderAdminPurgePage(content);
  else if (hash.startsWith('#/admin/cost')) renderAdminCostPage(content);
  else if (matterMatch) renderMatterDetail(content, matterMatch[1]);
  else renderMattersList(content);
}
window.addEventListener('hashchange', async () => { await renderShell(location.hash); route(); });

// ---------- boot / auth gate ----------
async function boot() {
  try { applyTheme(localStorage.getItem('litigation-agent-theme') || 'light'); } catch {}
  document.documentElement.setAttribute('lang', currentLang);
  document.documentElement.setAttribute('dir', currentLang === 'en' ? 'ltr' : 'rtl');

  const { data: { session } } = await sb.auth.getSession();
  if (!session) { renderLogin(); return; }

  // An admin-assigned temporary password (set manually, outside this
  // app's own UI — see CHANGELOG) marks the account with
  // user_metadata.must_change_password = true. Force the same "set new
  // password" screen the emailed reset link uses before anything else —
  // deliberately before the MFA check below, so nobody ever enrolls MFA
  // (or does anything else) while still on a password an admin knows.
  // renderSetNewPassword() clears this flag itself once a real password
  // is set, via updateUser({ data: { must_change_password: false } }).
  if (session.user?.user_metadata?.must_change_password) { renderSetNewPassword(); return; }

  // MFA is mandatory for every account (matters_require_mfa RLS policy
  // requires aal2 to read a matter at all) — so whether to force enrollment
  // has to be decided from the account's actual factor list, not from
  // getAuthenticatorAssuranceLevel() alone. nextLevel only becomes 'aal2'
  // once a VERIFIED factor already exists on the account; for a brand new
  // user with zero factors, nextLevel stays 'aal1' == currentLevel, so the
  // old check here (`aal.nextLevel === 'aal2' && ...`) was always false and
  // silently let a freshly invited user straight into the app with no MFA
  // prompt at all — confirmed on a real account (zero rows in
  // auth.mfa_factors, session amr = ['password'] only, yet logged in).
  const { data: factors } = await sb.auth.mfa.listFactors();
  const verified = (factors?.totp || []).find((f) => f.status === 'verified');
  if (!verified) { renderMfaEnroll(); return; }

  const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (aal && aal.currentLevel !== 'aal2') { renderMfaChallenge(verified.id); return; }

  viewer = await loadViewer().catch(() => null);
  if (!location.hash) { location.hash = '#/dashboard'; return; } // hashchange listener renders
  await renderShell(location.hash);
  route();
}

// A password-reset email link lands back on this same URL with a
// recovery token attached (hash fragment or query string, depending on
// Supabase's configured flow) — the client parses it and fires
// PASSWORD_RECOVERY below once the exchange completes. That happens
// asynchronously, whereas boot() below would otherwise run immediately
// and — worse — this app's own hash-based router (#/dashboard, #/matters/…)
// would try to treat a leftover recovery token in location.hash as a
// route. So: recognize a recovery link up front, hold off calling boot()
// until PASSWORD_RECOVERY actually fires, and fall through to the normal
// boot() only if it doesn't (an expired/already-used link), rather than
// hanging forever.
let recoveryHandled = false;
sb.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') { recoveryHandled = true; renderSetNewPassword(); }
  else if (event === 'SIGNED_OUT') renderLogin();
});

function isRecoveryUrl() {
  return /type=recovery/.test(location.hash) || /type=recovery/.test(location.search);
}

if (isRecoveryUrl()) {
  clear(app);
  app.appendChild(h('div', { class: 'auth-screen' }, h('div', { class: 'auth-card' }, h('p', { class: 'form-hint' }, 'جارٍ التحقق من رابط إعادة التعيين…'))));
  setTimeout(() => { if (!recoveryHandled) boot(); }, 4000);
} else {
  boot();
}
</script>
